#
# Reusable workflow that deploys the artifacts produced by .github/workflows/_extension_distribution.yml
#
# Note: this workflow can be used to deploy an extension from a GH artifact. It is intended for Out-of-tree
#       extensions that live the duckdb GitHub organisation (only repo's within the same organisation can share secrets
#       through reusable workflows)


name: Extension Deployment
on:
  workflow_call:
    inputs:
      # The name of the extension
      extension_name:
        required: true
        type: string
      # DuckDB version to deploy. When omitted, use the checked-out duckdb submodule.
      duckdb_version:
        required: false
        type: string
        default: ""
      # The extension-ci-tools ref used by this workflow.
      # Passing this explicitly is required because of https://github.com/actions/toolkit/issues/1264
      ci_tools_version:
        required: true
        type: string
      # Override the repo for the CI tools (for testing CI tools itself)
      override_ci_tools_repository:
        required: false
        type: string
        default: "duckdb/extension-ci-tools"
      # ';' separated list of architectures to exclude, for example: 'linux_amd64;osx_arm64'
      exclude_archs:
        required: false
        type: string
        default: ""
      # ';' separated list of architectures to opt into, for example: 'osx_amd64;windows_arm64;linux_arm64_musl'
      # Explicit opt-ins override reduced CI, while exclusions take precedence.
      opt_in_archs:
        required: false
        type: string
        default: ""
      # Whether to upload this deployment as the latest. This may overwrite a previous deployment.
      deploy_latest:
        required: false
        type: boolean
        default: false
      # Whether to upload this deployment under a versioned path. These will not be deleted automatically
      deploy_versioned:
        required: false
        type: boolean
        default: false
      # Postfix added to artifact names. Can be used to guarantee unique names when this workflow is called multiple times
      artifact_postfix:
        required: false
        type: string
        default: ""
      # Override the default deploy script with a custom script
      deploy_script:
        required: false
        type: string
        default: "./duckdb/scripts/extension-upload-single.sh"
      # auto/enabled/disabled: when enabled (or enabled through auto) will skip redundant architectures to reduce CI load
      reduced_ci_mode:
        required: false
        type: string
        default: 'auto'

jobs:
  generate_matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      deploy_matrix: ${{ steps.parse-matrices.outputs.deploy_matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout Extension CI tools
        with:
          path: 'extension-ci-tools'
          ref: ${{ inputs.ci_tools_version }}
          repository: ${{ inputs.override_ci_tools_repository }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: extension-ci-tools/scripts/extbuild/go.mod
          cache: true
          cache-dependency-path: extension-ci-tools/scripts/extbuild/go.sum

      - id: parse-matrices
        run: |
          make -C extension-ci-tools/scripts/extbuild build -sj4
          extension-ci-tools/scripts/extbuild/build/extbuild matrix \
            --input extension-ci-tools/config/distribution_matrix.json \
            --exclude "${{ inputs.exclude_archs }}" \
            --opt-in "${{ inputs.opt_in_archs }}" \
            --reduced-ci-mode "${{ inputs.reduced_ci_mode }}" \
            --deploy \
            --out "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Haybarn R2 (${{ matrix.duckdb_arch }})
    runs-on: ubuntu-latest
    needs: generate_matrix
    if: ${{ needs.generate_matrix.outputs.deploy_matrix != '{}' && needs.generate_matrix.outputs.deploy_matrix != '' }}
    strategy:
      matrix: ${{fromJson(needs.generate_matrix.outputs.deploy_matrix)}}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Checkout / Extension CI tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension-ci-tools
          ref: ${{ inputs.ci_tools_version }}
          repository: ${{ inputs.override_ci_tools_repository }}

      - name: Checkout / Prepare DuckDB source
        id: prepare_sources
        env:
          CI_PLATFORM: linux
          DUCKDB_PLATFORM: ${{ matrix.duckdb_arch }}
          DUCKDB_VERSION: ${{ inputs.duckdb_version }}
          # Haybarn: deploy against the Haybarn engine fork; an extension's own
          # duckdb/ submodule (pointing at upstream) is re-pointed to it.
          CI_DUCKDB_GIT_REPOSITORY: https://github.com/Query-farm-haybarn/haybarn.git
        run: python3 extension-ci-tools/scripts/ci_phase.py checkout

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ inputs.extension_name }}-${{ steps.prepare_sources.outputs.duckdb_version }}-extension-${{matrix.duckdb_arch}}${{inputs.artifact_postfix}}${{startsWith(matrix.duckdb, 'wasm') && '.wasm' || ''}}
          path: |
            /tmp/extension

      - name: Deploy
        # Haybarn: upload to the Haybarn R2 bucket with the engine-shared secret
        # names (as the engine's core-extension publish does), signed with the
        # Haybarn extension key. DuckDB's nightly bucket secrets are not set in
        # Haybarn repos, where the upstream step silently uploaded nothing.
        env:
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          # The org secret holding the secret half is named R2_SECRET_KEY_ID.
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the newer default sigv4 checksum headers.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          # Core-extension layout <bucket>/core/...; aws s3 cp takes the prefix
          # as part of the object key.
          BUCKET_NAME: ${{ secrets.R2_BUCKET }}/core
          DUCKDB_EXTENSION_SIGNING_PK: ${{ secrets.HAYBARN_EXTENSION_SIGNING_PK }}
          DUCKDB_DEPLOY_SCRIPT_MODE: ${{ secrets.R2_SECRET_KEY_ID != '' && 'for_real' || '' }}
        # CalVer EXT_VERSION, haybarn-v* -> vX.Y.Z URL segment and the short
        # Cache-Control on the rolling-latest path live in a composite action so
        # other Haybarn workflows can reuse them.
        uses: ./extension-ci-tools/.github/actions/calver-deploy
        with:
          extension_name: ${{ inputs.extension_name }}
          duckdb_arch: ${{ matrix.duckdb_arch }}
          deploy_latest: ${{ inputs.deploy_latest }}
          deploy_versioned: ${{ inputs.deploy_versioned }}
          deploy_script: ${{ inputs.deploy_script }}
