#
# Reusable workflow that deploys the artifacts produced by .github/workflows/_extension_distribution.yml
#
# Note: this workflow can be used to deploy an extension from a GH artifact. It is intended for Out-of-tree
#       extensions that live the duckdb GitHub organisation (only repo's within the same organisation can share secrets
#       through reusable workflows)


name: Extension Deployment
on:
  workflow_call:
    inputs:
      # The name of the extension
      extension_name:
        required: true
        type: string
      # DuckDB version to build against
      duckdb_version:
        required: true
        type: string
      # The version of the https://github.com/duckdb/extension-ci-tools submodule of the extension. In most cases will be identical to `duckdb_version`.
      # Passing this explicitly is required because of https://github.com/actions/toolkit/issues/1264
      ci_tools_version:
        required: true
        type: string
      # Override the repo for the CI tools (for testing CI tools itself)
      override_ci_tools_repository:
        required: false
        type: string
        default: "duckdb/extension-ci-tools"
      # ';' separated list of architectures to exclude, for example: 'linux_amd64;osx_arm64'
      exclude_archs:
        required: false
        type: string
        default: ""
      # ';' separated list of architectures to opt into, for example: 'windows_arm64;linux_arm64_musl'
      opt_in_archs:
        required: false
        type: string
        default: ""
      # Whether to upload this deployment as the latest. This may overwrite a previous deployment.
      deploy_latest:
        required: false
        type: boolean
        default: false
      # Whether to upload this deployment under a versioned path. These will not be deleted automatically
      deploy_versioned:
        required: false
        type: boolean
        default: false
      # Postfix added to artifact names. Can be used to guarantee unique names when this workflow is called multiple times
      artifact_postfix:
        required: false
        type: string
        default: ""
      # Override the default deploy script with a custom script
      deploy_script:
        required: false
        type: string
        default: "./duckdb/scripts/extension-upload-single.sh"
      # Override the default matrix parse script with a custom script
      matrix_parse_script:
        required: false
        type: string
        default: "./extension-ci-tools/scripts/modify_distribution_matrix.py"
      # auto/enabled/disabled: when enabled (or enabled through auto) will skip redundant architectures to reduce CI load
      reduced_ci_mode:
        required: false
        type: string
        default: 'auto'

jobs:
  generate_matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      deploy_matrix: ${{ steps.parse-matrices.outputs.deploy_matrix }}
    steps:
      - uses: actions/checkout@v6
        name: Checkout Extension CI tools
        with:
          path: 'extension-ci-tools'
          ref: ${{ inputs.ci_tools_version }}
          repository: ${{ inputs.override_ci_tools_repository }}

      - id: parse-matrices
        run: |
          python3 ${{ inputs.matrix_parse_script }} --input extension-ci-tools/config/distribution_matrix.json --deploy_matrix --output deploy_matrix.json --exclude "${{ inputs.exclude_archs }}" --opt_in "${{ inputs.opt_in_archs }}" --pretty --reduced_ci_mode ${{ inputs.reduced_ci_mode }}
          deploy_matrix="`cat deploy_matrix.json`"
          echo deploy_matrix=$deploy_matrix >> $GITHUB_OUTPUT
          echo `cat $GITHUB_OUTPUT`

  deploy:
    name: Deploy to nightly
    runs-on: ubuntu-latest
    needs: generate_matrix
    if: ${{ needs.generate_matrix.outputs.deploy_matrix != '{}' && needs.generate_matrix.outputs.deploy_matrix != '' }}
    strategy:
      matrix: ${{fromJson(needs.generate_matrix.outputs.deploy_matrix)}}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: 'recursive'

      # Composite actions can't pin to a dynamic ref via `uses:`, so we
      # check out extension-ci-tools at the caller-provided ref and invoke
      # the deploy action via a local-path `uses: ./extension-ci-tools/...`.
      - uses: actions/checkout@v6
        name: Checkout Extension CI tools
        with:
          path: 'extension-ci-tools'
          ref: ${{ inputs.ci_tools_version }}
          repository: ${{ inputs.override_ci_tools_repository }}

      - name: Checkout DuckDB to version
        # Haybarn: clone the Haybarn engine fork rather than upstream duckdb/duckdb.
        # Required because duckdb_version may be a Haybarn-specific tag (e.g.
        # haybarn-v1.5.2-rc13) that doesn't exist on the upstream remote — checkout
        # would fail with "pathspec '...' did not match any file(s) known to git".
        # The clone target matches the override_duckdb_repository default used by
        # _extension_distribution.yml's build job.
        #
        # Force-replace any existing `duckdb/` directory the caller's checkout
        # may have brought in via submodule init (the haybarn-httpfs repo has a
        # `duckdb/` submodule pointing at upstream duckdb/duckdb, which would
        # otherwise survive into this step and prevent the haybarn-engine clone).
        run: |
          rm -rf duckdb
          git clone https://github.com/Query-farm-haybarn/haybarn.git duckdb
          cd duckdb
          git fetch --tags
          git checkout ${{ inputs.duckdb_version }}

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.extension_name }}-${{ inputs.duckdb_version }}-extension-${{matrix.duckdb_arch}}${{inputs.artifact_postfix}}${{startsWith(matrix.duckdb, 'wasm') && '.wasm' || ''}}
          path: |
            /tmp/extension

      - name: Deploy
        # Haybarn: route uploads at the Haybarn R2 bucket using the engine-shared
        # secret names. Matches what Query-farm-haybarn/haybarn/.github/workflows/haybarn-extensions.yml
        # uses for core extension publishing (R2_* + HAYBARN_EXTENSION_SIGNING_PK,
        # bucket suffix `/core`). The upstream secret names
        # (DUCKDB_EXTENSIONS_NIGHTLY_S3_*, S3_DUCKDB_ORG_EXTENSION_SIGNING_PK)
        # aren't set in Haybarn build-fork repos, so the old version silently
        # no-op'd via extension-upload-single.sh's "No AWS key found, skipping.."
        # branch — leaving the deploy job green but uploading nothing.
        env:
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          # NOTE: org secret is `R2_SECRET_KEY_ID`, not `R2_SECRET_ACCESS_KEY` —
          # matches the engine workflow at haybarn-extensions.yml:125.
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY_ID }}
          AWS_DEFAULT_REGION: auto
          # Cloudflare R2 rejects new sigv4 checksum headers introduced in
          # awscli >= 1.36 / v2 >= 2.23 (surfaces as AccessDenied on PutObject).
          # Pin to pre-2024 checksum behavior.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          # Core-extension URL layout is `<bucket>/core/...`, matching the
          # haybarn engine's haybarn-extensions.yml:146. The upload script's
          # $5 (bucket name) accepts "<bucket>/<prefix>" because aws s3 cp
          # treats anything after the bucket as the object key.
          BUCKET_NAME: ${{ secrets.R2_BUCKET }}/core
          DUCKDB_EXTENSION_SIGNING_PK: ${{ secrets.HAYBARN_EXTENSION_SIGNING_PK }}
          DUCKDB_DEPLOY_SCRIPT_MODE: for_real
          PIP_BREAK_SYSTEM_PACKAGES: 1
        # Haybarn: the actual upload logic lives in a reusable composite action
        # under .github/actions/calver-deploy so it can be invoked from other
        # workflows in the ecosystem (engine's haybarn-extensions.yml, build-
        # fork extension repos, ad-hoc tooling) without duplicating the
        # derivation logic. The action handles:
        #   1. Strip haybarn-v*(-rcN)? to plain vX.Y.Z for the URL segment.
        #   2. Compute EXT_VERSION as CalVer from HEAD's commit timestamp.
        #   3. Run extension-upload-single.sh with derived versions.
        #   4. Patch Cache-Control on the rolling-latest path (R2/Cloudflare).
        # The deploy_script input is forwarded so extensions can override the
        # upload command.
        uses: ./extension-ci-tools/.github/actions/calver-deploy
        with:
          extension_name: ${{ inputs.extension_name }}
          duckdb_arch: ${{ matrix.duckdb_arch }}
          deploy_latest: ${{ inputs.deploy_latest }}
          deploy_versioned: ${{ inputs.deploy_versioned }}
          deploy_script: ${{ inputs.deploy_script }}
