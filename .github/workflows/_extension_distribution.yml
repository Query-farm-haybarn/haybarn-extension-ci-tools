# Reusable workflow for building DuckDB extensions using a standardized environment
#
# The workflow:
#   - builds the extension using the CI workflow from the corresponding DuckDB version
#   - uploads the extensions as gh actions artifacts in the following format:
#         <ext_name>-<duckdb_version>-extension-<arch><optional_postfix>
#
# note: extensions are simply uploaded to GitHub actions, deploying the extensions is done a separate step. More info on
#       this can be found in https://github.com/duckdb/extension-template

name: Extension distribution
on:
  workflow_call:
    secrets:
      VCPKG_CACHING_AWS_ACCESS_KEY_ID:
        required: false
      VCPKG_CACHING_AWS_SECRET_ACCESS_KEY:
        required: false
      VCPKG_CACHING_AWS_ENDPOINT_URL:
        required: false
      VCPKG_CACHING_AWS_DEFAULT_REGION:
        required: false
      # Haybarn fork: optional bearer token. When `vcpkg_binary_sources` contains
      # the `{0}` placeholder, it is substituted with this secret at job-start.
      vcpkg_token:
        required: false
    inputs:
      # The name with which the extension will be built
      extension_name:
        required: true
        type: string
      # If our extension is an alias extension, the name of the canonical extension
      extension_canonical:
        required: false
        type: string
      # DuckDB version to build against, should in most cases be identical to
      duckdb_version:
        required: true
        type: string
      # The version of the https://github.com/duckdb/extension-ci-tools submodule of the extension. In most cases will be identical to `duckdb_version`.
      # Passing this explicitly is required because of https://github.com/actions/toolkit/issues/1264
      ci_tools_version:
        required: true
        type: string
      # ';' separated list of architectures to exclude, for example: 'linux_amd64;osx_arm64'
      exclude_archs:
        required: false
        type: string
        default: ""
      # ';' separated list of architectures to opt into, for example: 'windows_arm64;linux_arm64_musl'
      opt_in_archs:
        required: false
        type: string
        default: ""
      # Postfix added to artifact names. Can be used to guarantee unique names when this workflow is called multiple times
      artifact_postfix:
        required: false
        type: string
        default: ""
      # Override the default vcpkg repository
      vcpkg_url:
        required: false
        type: string
        default: "https://github.com/microsoft/vcpkg.git"
      # Override the default vcpkg commit used by this version of DuckDB
      vcpkg_commit:
        required: false
        type: string
        default: "84bab45d415d22042bd0b9081aea57f362da3f35"
      # Override the vcpkg binary sources config. By default, we use the public (read-only) cache from duckdb.
      vcpkg_binary_sources:
        required: false
        type: string
        default: ''
      # Override the vcpkg asset sources config (download mirror for source
      # tarballs). Default = the Haybarn cache; pass a value to point at your
      # own asset mirror or to disable.
      vcpkg_asset_sources:
        required: false
        type: string
        default: ''
      vcpkg_extra_dependencies:
        required: false
        type: string
        default: ''
      # Override the default script producing the matrices. Allows specifying custom matrices.
      matrix_parse_script:
        required: false
        type: string
        default: "./extension-ci-tools/scripts/modify_distribution_matrix.py"
      # Enable building the DuckDB Shell
      build_duckdb_shell:
        required: false
        type: boolean
        default: true
      # Supply an override repository to build, instead of using the current one
      override_repository:
        required: false
        type: string
        default: ""
      # The git ref used for the override_repository
      override_ref:
        required: false
        type: string
        default: ""
      # Override the repo for the CI tools (for testing CI tools itself)
      override_ci_tools_repository:
        required: false
        type: string
        default: "duckdb/extension-ci-tools"
      # Override the duckdb repository (for using this workflow from a DuckDB fork)
      override_duckdb_repository:
        required: false
        type: string
        default: ""
      # Internal tooling option: allows automatically fetching the duckdb repo and ref from the calling repository.
      set_caller_as_duckdb:
        required: false
        type: boolean
        default: false
      # Pass extra toolchains
      #   available: (parser_tools, rust, fortran, omp, python3)
      extra_toolchains:
        required: false
        type: string
        default: ""
      # Experimental option to allow automatically building the vcpkg dependencies of duckdb extensions that are used for testing
      use_merged_vcpkg_manifest:
        required: false
        type: string
        default: ""
      rust_logs:
        required: false
        type: boolean
        default: false
      # Optional tag the build extension should have -- this is easy to misuse, and subject to change, for internal use only
      extension_tag:
        required: false
        type: string
        default: ""
      # Optional tag the referenced duckdb should have -- this is a easy to misuse, and subject to change, for internal use only
      duckdb_tag:
        required: false
        type: string
        default: ""
      # If set tot true, skip tests
      skip_tests:
        required: false
        type: boolean
        default: false
      save_cache:
        required: false
        type: boolean
        default: true
      # DEPRECATED: use extra_toolchains instead
      enable_rust:
        required: false
        type: boolean
        default: false
      test_config:
        required: false
        type: string
        default: "{}"
      build_type:
        required: false
        type: string
        default: "release"
      upload_all_extensions:
        required: false
        type: boolean
        default: false
      extra_extension_config:
        required: false
        type: string
        default: ""
      # auto/enabled/disabled: when enabled (or enabled through auto) will skip redundant architectures to reduce CI load
      reduced_ci_mode:
        required: false
        type: string
        default: 'auto'
      # disabling this can result in faster builds, but may run out of space on some runners
      run_disk_clean_step:
        required: false
        type: boolean
        default: true
      extensions_test_selection:
        required: false
        type: string
        default: 'regular'
      # Haybarn: opt into pulling a pre-built build-environment image from GHCR
      # (published by publish-build-images.yml) instead of running `docker build`
      # inline on every Linux job. Saves ~5-8 min of Docker setup per leg, which
      # adds up to ~70 CI hours per 150-extension build_all. Default false so
      # existing callers (e.g. haybarn-extensions.yml) keep the original
      # behavior until they opt in.
      use_prebuilt_images:
        required: false
        type: boolean
        default: false
      # Which pre-built image variant to pull when use_prebuilt_images=true:
      #   base — no extras  (default, covers ~80% of extensions)
      #   rust — base + Rust toolchain
      #   full — base + Rust + Go + Fortran + parser_tools + unixodbc + multimedia
      # Ignored when use_prebuilt_images=false.
      image_variant:
        required: false
        type: string
        default: 'base'
      # Tag of the pre-built image to pull. Conventionally the engine version
      # (e.g. v1.5.2). The publish-build-images workflow tags images with the
      # engine version they bake in, so consumers can pin this to the same
      # value they use for `duckdb_version` and get a matching image.
      prebuilt_image_tag:
        required: false
        type: string
        default: 'v1.5.2'
      # The org/user namespace under ghcr.io that holds the published images.
      # Defaults to the Haybarn org; can be overridden if a fork republishes
      # the image set under a different namespace.
      prebuilt_image_namespace:
        required: false
        type: string
        default: 'query-farm-haybarn'
      # Haybarn: when true, the wasm leg pulls
      # ghcr.io/<prebuilt_image_namespace>/haybarn-wasm-<wasm_image_variant>:<prebuilt_image_tag>
      # instead of installing emsdk + vcpkg inline. Eliminates the per-run
      # emsdk download (~300 MB, ~30-60s) AND removes the variable-UUID
      # emsdk path that defeats ccache hashing — emcc lives at /emsdk/...
      # in the image. Off by default while we shake out the new path; flip
      # on per-caller via the workflow input. See docker/wasm/Dockerfile.
      use_prebuilt_wasm_image:
        required: false
        type: boolean
        default: false
      # Which wasm Docker variant to pull. Mirrors `image_variant` for the
      # Linux Docker fleet:
      #   base — no extras (covers most C++-only extensions)
      #   rust — rust toolchain + wasm32-unknown-emscripten target
      #          (required by descriptors with `requires_toolchains: rust`,
      #          e.g. `inflector`)
      # Ignored when use_prebuilt_wasm_image=false.
      wasm_image_variant:
        required: false
        type: string
        default: 'base'

env:
  # Default to the Haybarn vcpkg cache (readwrite, fronted by the
  # Cloudflare Worker → R2). Reads are anonymous; writes need the bearer
  # token, substituted at job-start via the `{0}` placeholder. Callers
  # can override via `vcpkg_binary_sources` if they need to point elsewhere
  # (e.g. a fork running its own cache).
  #
  # The upstream `https://vcpkg-cache.duckdb.org,read` default was the
  # original fork's fallback — read-only, but more importantly NOT writable,
  # so cold-miss build outputs were never repopulated and every cold run
  # paid the full vcpkg compile cost. Switching the default here gives us
  # automatic write-back on cold misses without each caller having to
  # remember to set the URL.
  # Wrapped in YAML double-quotes because the inner GHA expression contains
  # `Authorization: Bearer …` — the colon-space-text shape would otherwise be
  # parsed as a YAML mapping by tools (and by GitHub itself).
  VCPKG_BINARY_SOURCES: "${{ format(inputs.vcpkg_binary_sources == '' && 'clear;http,https://haybarn-vcpkg-cache.rusty-bb6.workers.dev,readwrite,Authorization: Bearer {0}' || inputs.vcpkg_binary_sources, secrets.vcpkg_token) }}"
  # Haybarn vcpkg ASSET cache (source-tarball mirror). Lives on the same
  # Worker + R2 bucket as the binary cache, under the `assets/` key prefix.
  # vcpkg's asset cache uses `x-azurl` — misnamed; works against any HTTP
  # endpoint serving GET/PUT `<base>/<sha512>?<sas>`. Auth is in the URL
  # query string because `x-azurl` has no Authorization-header support;
  # the Worker accepts `?auth=<token>` as an equivalent of the header.
  # `readwrite` + no `x-block-origin` = transparent mirror with origin
  # fallback on cold miss, write-back on success — exactly the shape we
  # want for transient-outage resilience without sacrificing reproducibility.
  X_VCPKG_ASSET_SOURCES: "${{ inputs.vcpkg_asset_sources == '' && format('clear;x-azurl,https://haybarn-vcpkg-cache.rusty-bb6.workers.dev/assets/,auth={0},readwrite', secrets.vcpkg_token) || inputs.vcpkg_asset_sources }}"

jobs:
  generate_matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      linux_matrix: ${{ steps.set-matrix-linux.outputs.linux_matrix }}
      windows_matrix: ${{ steps.set-matrix-windows.outputs.windows_matrix }}
      osx_matrix: ${{ steps.set-matrix-osx.outputs.osx_matrix }}
      wasm_matrix: ${{ steps.set-matrix-wasm.outputs.wasm_matrix }}
    steps:
      - uses: actions/checkout@v6
        name: Checkout Extension CI tools
        with:
          path: 'extension-ci-tools'
          ref: ${{ inputs.ci_tools_version }}
          repository: ${{ inputs.override_ci_tools_repository }}

      - id: parse-matrices
        run: |
          mkdir build
          python3 ${{ inputs.matrix_parse_script }} --input extension-ci-tools/config/distribution_matrix.json --select_os linux   --output build/linux_matrix.json   --exclude "${{ inputs.exclude_archs }}" --opt_in "${{ inputs.opt_in_archs }}" --pretty --reduced_ci_mode ${{ inputs.reduced_ci_mode }}
          python3 ${{ inputs.matrix_parse_script }} --input extension-ci-tools/config/distribution_matrix.json --select_os osx     --output build/osx_matrix.json     --exclude "${{ inputs.exclude_archs }}" --opt_in "${{ inputs.opt_in_archs }}" --pretty --reduced_ci_mode ${{ inputs.reduced_ci_mode }}
          python3 ${{ inputs.matrix_parse_script }} --input extension-ci-tools/config/distribution_matrix.json --select_os windows --output build/windows_matrix.json --exclude "${{ inputs.exclude_archs }}" --opt_in "${{ inputs.opt_in_archs }}" --pretty --reduced_ci_mode ${{ inputs.reduced_ci_mode }}
          python3 ${{ inputs.matrix_parse_script }} --input extension-ci-tools/config/distribution_matrix.json --select_os wasm    --output build/wasm_matrix.json    --exclude "${{ inputs.exclude_archs }}" --opt_in "${{ inputs.opt_in_archs }}" --pretty --reduced_ci_mode ${{ inputs.reduced_ci_mode }}

      - id: set-matrix-linux
        run: |
          linux_matrix="`cat build/linux_matrix.json`"
          echo linux_matrix=$linux_matrix >> $GITHUB_OUTPUT
          echo `cat $GITHUB_OUTPUT`

      - id: set-matrix-osx
        run: |
          osx_matrix="`cat build/osx_matrix.json`"
          echo osx_matrix=$osx_matrix >> $GITHUB_OUTPUT
          echo `cat $GITHUB_OUTPUT`

      - id: set-matrix-windows
        run: |
          windows_matrix="`cat build/windows_matrix.json`"
          echo windows_matrix=$windows_matrix >> $GITHUB_OUTPUT
          echo `cat $GITHUB_OUTPUT`

      - id: set-matrix-wasm
        run: |
          wasm_matrix="`cat build/wasm_matrix.json`"
          echo wasm_matrix=$wasm_matrix >> $GITHUB_OUTPUT
          echo `cat $GITHUB_OUTPUT`

  linux:
    name: Linux
    runs-on: ${{ matrix.runner }}
    needs: generate_matrix
    if: ${{ needs.generate_matrix.outputs.linux_matrix != '{}' && needs.generate_matrix.outputs.linux_matrix != '' }}
    strategy:
      matrix: ${{fromJson(needs.generate_matrix.outputs.linux_matrix)}}
    env:
      # Haybarn: strip Haybarn engine-tag affixes so DuckDB's CMake recognizes
      # the version — it accepts vX.Y.Z, vX.Y.Z-rcN, vX.Y.Z-N-gSHA; the
      # Haybarn-prefixed `haybarn-vX.Y.Z(-rcN)?` form falls through to the
      # v0.0.1 default, which makes the extension unloadable by haybarn-cli
      # ("built specifically for engine version 'v0.0.1'"). For tags like
      # haybarn-v1.5.2-rc13 the engine still reports library_version=v1.5.2,
      # so that's what extensions must embed.
      OVERRIDE_GIT_DESCRIBE: ${{ startsWith(inputs.duckdb_version, 'haybarn-v1.5.2') && 'v1.5.2' || inputs.duckdb_version }}
      # VCPKG config
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_target_triplet }}
      VCPKG_HOST_TRIPLET: ${{ matrix.vcpkg_host_triplet }}
      # VCPKG caching
      AWS_ACCESS_KEY_ID: ${{ secrets.VCPKG_CACHING_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VCPKG_CACHING_AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.VCPKG_CACHING_AWS_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ secrets.VCPKG_CACHING_AWS_DEFAULT_REGION }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      # Misc
      GEN: ninja
      BUILD_SHELL: ${{ inputs.build_duckdb_shell && '1' || '0' }}
      DUCKDB_PLATFORM: ${{ matrix.duckdb_arch }}

    steps:
      - name: Free disk space 1
        uses: endersonmenezes/free-disk-space@v2.1.1
        continue-on-error: true
        if: inputs.run_disk_clean_step
        with:
#          remove_android: true # ~9.5GB in #52s
#          remove_dotnet: true
          remove_haskell: true # ~6.5GB in ~3s
          remove_tool_cache: true # ~4.8GB in ~17s
#          remove_swap: true
#          remove_packages_one_command: true # ~7.5 GB in ~94s
          remove_folders: "/usr/local/share/powershell /usr/share/swift" # ~ 4GB in ?s
          testing: false

      - name: Free disk space 2
        continue-on-error: true
        if: inputs.run_disk_clean_step
        run: |
          docker images -a -q > package.list
          if [ -s package.list ]; then
              echo "To be deleted"
              cat package.list
              echo "---"
              docker rmi $(cat package.list)
          fi
          rm package.list

      - name: Restart docker to run on /mnt
        run: |
          sudo systemctl stop docker

      - name: Configure Docker with custom data directory
        run: |
          sudo mkdir -p /mnt/docker-data
          echo '{ "data-root": "/mnt/docker-data" }' | sudo tee /etc/docker/daemon.json

      - name: Start Docker with updated storage path
        run: sudo systemctl start docker

      - name: Verify Docker storage path
        run: docker info | grep "Docker Root Dir"

      - uses: actions/checkout@v6
        name: Checkout override repository
        if: ${{inputs.override_repository != ''}}
        with:
          repository: ${{ inputs.override_repository }}
          ref: ${{ inputs.override_ref }}
          fetch-depth: 0
          submodules: recursive   # Haybarn: many real community extensions (h3, scrooge, etc.) have submodules that are load-bearing for the build (CMakeLists.txt does `add_subdirectory(<submodule>)`). The old `submodules: false` optimization was safe for the canonical extension-template (no real submodules) but failed for real extensions: e.g. h3's CMakeLists does `add_subdirectory(h3)` against an h3-library submodule. Recursive is slower per leg but correct in the general case.

      - uses: actions/checkout@v6
        name: Checkout current repository
        if: ${{inputs.override_repository == ''}}
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - uses: actions/checkout@v6
        name: Checkout Extension CI tools
        with:
          path: 'extension-ci-tools'
          ref: ${{ inputs.ci_tools_version }}
          repository: ${{ inputs.override_ci_tools_repository }}

      - name: Fetch override repository
        if: ${{inputs.override_duckdb_repository != ''}}
        run: |
          rm -rf duckdb && git clone --depth=1 --branch "${{ inputs.duckdb_version }}" --single-branch "${{ inputs.override_duckdb_repository }}" duckdb

      - name: Set DuckDB to ref of calling workflow
        if: ${{inputs.set_caller_as_duckdb}}
        uses: actions/checkout@v6
        with:
          path: 'duckdb'
          fetch-tags: true
          fetch-depth: 0

      - name: Checkout DuckDB to version
        if: ${{ inputs.duckdb_version != '' }}
        run: |
          (cd duckdb && git checkout "${{ inputs.duckdb_version }}")

      - name: Tag extension
        if: ${{inputs.extension_tag != ''}}
        run: |
          git tag ${{ inputs.extension_tag }}

      - name: Tag DuckDB extension
        if: ${{inputs.duckdb_tag != ''}}
        run: |
          DUCKDB_TAG=${{ inputs.duckdb_tag }} make set_duckdb_tag

      - uses: actions/checkout@v6
        name: Checkout Extension CI tools
        with:
          path: 'extension-ci-tools'
          ref: ${{ inputs.ci_tools_version }}
          repository: ${{ inputs.override_ci_tools_repository }}
          fetch-depth: 0

      # Haybarn: two paths to a `duckdb/<arch>` local image tag — either pull
      # a pre-built image from GHCR (fast, ~30s) or build inline (slow, ~5-8m).
      # Both end with the same local tag `duckdb/${arch}` so all downstream
      # `docker run duckdb/${arch} …` lines work unchanged.
      #
      # We `docker login ghcr.io` even though most users would prefer public
      # GHCR images: it makes the workflow agnostic to package visibility,
      # so private images work too. The ambient GITHUB_TOKEN has packages:read
      # on the same-org packages by default; if a fork republishes images
      # under a different namespace, that fork's GITHUB_TOKEN won't have
      # cross-org packages:read and the pull will still fail loudly with 401.
      - name: Log in to GHCR (for pre-built image pull)
        if: ${{ inputs.use_prebuilt_images }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull pre-built Docker image
        if: ${{ inputs.use_prebuilt_images }}
        shell: bash
        env:
          # Compose the full reference once for both the docker pull and the
          # subsequent local-tag step. Format:
          #   ghcr.io/<namespace>/haybarn-<arch>-<variant>:<tag>
          # Variant suffix is uniform (even `-base`) so the URL template
          # never has to special-case "no variant."
          IMAGE_REF: ghcr.io/${{ inputs.prebuilt_image_namespace }}/haybarn-${{ matrix.duckdb_arch }}-${{ inputs.image_variant }}:${{ inputs.prebuilt_image_tag }}
        run: |
          echo "Pulling ${IMAGE_REF}"
          docker pull "${IMAGE_REF}"
          docker tag  "${IMAGE_REF}" "duckdb/${{ matrix.duckdb_arch }}"

      - name: Build Docker image
        if: ${{ !inputs.use_prebuilt_images }}
        shell: bash
        run: |
          docker build \
            --build-arg 'vcpkg_url=${{ inputs.vcpkg_url }}' \
            --build-arg 'vcpkg_commit=${{ inputs.vcpkg_commit }}' \
            --build-arg 'extra_toolchains=${{ inputs.enable_rust  && format(';{0};rust;', inputs.extra_toolchains) || format(';{0};', inputs.extra_toolchains) }}' \
            -t duckdb/${{ matrix.duckdb_arch }} \
            ./extension-ci-tools/docker/${{ matrix.duckdb_arch }}

      - name: Create env file for docker
        run: |
          cat <<-EOF > docker_env.txt
          VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES
          X_VCPKG_ASSET_SOURCES=$X_VCPKG_ASSET_SOURCES
          USE_MERGED_VCPKG_MANIFEST=${{ inputs.use_merged_vcpkg_manifest }}
          AWS_ACCESS_KEY_ID=${{ secrets.VCPKG_CACHING_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.VCPKG_CACHING_AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL=${{ secrets.VCPKG_CACHING_AWS_ENDPOINT_URL }}
          AWS_DEFAULT_REGION=${{ secrets.VCPKG_CACHING_AWS_DEFAULT_REGION }}
          AWS_REQUEST_CHECKSUM_CALCULATION=when_required
          VCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_target_triplet }}
          VCPKG_OVERLAY_TRIPLETS=/duckdb_build_dir/extensions-ci-tools/toolchains
          VCPKG_OVERLAY_PORTS=/duckdb_build_dir/extension-ci-tools/vcpkg_ports
          BUILD_SHELL=${{ inputs.build_duckdb_shell && '1' || '0' }}
          OPENSSL_ROOT_DIR=/duckdb_build_dir/build/${{ inputs.build_type }}/vcpkg_installed/${{ matrix.vcpkg_target_triplet }}
          OPENSSL_DIR=/duckdb_build_dir/build/${{ inputs.build_type }}/vcpkg_installed/${{ matrix.vcpkg_target_triplet }}
          OPENSSL_USE_STATIC_LIBS=true
          DUCKDB_PLATFORM=${{ matrix.duckdb_arch }}
          DUCKDB_GIT_VERSION=${{ inputs.duckdb_version }}
          # Haybarn: forward the normalized version label into the container so
          # CMake embeds the right engine library_version in the extension binary.
          OVERRIDE_GIT_DESCRIBE=${{ startsWith(inputs.duckdb_version, 'haybarn-v1.5.2') && 'v1.5.2' || inputs.duckdb_version }}
          ENABLE_EXTENSION_AUTOINSTALL=1
          ENABLE_EXTENSION_AUTOLOADING=1
          EXTENSION_NAME=${{ inputs.extension_name }}
          EXTENSION_CANONICAL=${{ inputs.extension_canonical }}
          LINUX_CI_IN_DOCKER=1
          CCACHE_MAXSIZE=1G
          CCACHE_NOCOMPRESS=1
          # Haybarn: strip absolute workspace prefix from ccache hashes so
          # vcpkg's per-run buildtrees temp paths don't bust the cache, and
          # let __DATE__/__TIME__/header-mtime variance through. The
          # /duckdb_build_dir path is the volume mount target inside the
          # manylinux container.
          CCACHE_BASEDIR=/duckdb_build_dir
          CCACHE_NOHASHDIR=1
          CCACHE_SLOPPINESS=time_macros,include_file_mtime,pch_defines
          CCACHE_COMPILERCHECK=content
          # Haybarn: remote ccache backend (Cloudflare Worker fronting R2,
          # same bucket/auth as the vcpkg cache). Reads anonymous, writes
          # use Bearer token. Local cache stays L1, R2 is L2 (shared across
          # repos + branches + runners — survives GH cache flakiness).
          CCACHE_REMOTE_STORAGE=http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.vcpkg_token }}|connect-timeout=10000|operation-timeout=30000
          # Haybarn: sccache as RUSTC_WRAPPER for community extensions that
          # compile Rust (build:cargo + many cmake exts with rust deps).
          # WebDAV backend → same R2 worker as ccache, under sccache/ prefix.
          # CARGO_INCREMENTAL=0 because cargo's incremental compilation and
          # sccache are mutually exclusive — incremental is also broken on
          # fresh runners anyway. Harmless when no Rust is compiled.
          RUSTC_WRAPPER=sccache
          SCCACHE_WEBDAV_ENDPOINT=https://haybarn-vcpkg-cache.rusty-bb6.workers.dev/sccache/
          SCCACHE_WEBDAV_TOKEN=${{ secrets.vcpkg_token }}
          CARGO_INCREMENTAL=0
          SUBSET_EXTENSIONS_TESTS=${{ inputs.extensions_test_selection }}
          EOF
          echo '${{ inputs.test_config }}'| jq -r '.test_env_variables // {} | to_entries | map("\(.key)=\(.value)")|.[]' >> docker_env.txt

      # Haybarn: dropped the actions/cache restore/save pair. Empirically the
      # L1 GH cache was thrashing under high-churn parallel community-extension
      # builds (10 GB per-repo cap, LRU evicted entries before next build).
      # Restore step routinely reported "Cache not found for input keys". R2
      # is now the only ccache backend — slower than warm L1 but actually
      # consistent across runs. See haybarn-status snapshot 2026-05-16.
      - name: Create Ccache directory
        run: |
          mkdir ccache_dir

      - name: Run configure (outside Docker)
        shell: bash
        env:
          DUCKDB_GIT_VERSION: ${{ inputs.duckdb_version }}
          LINUX_CI_IN_DOCKER: 0
        run: |
          make configure_ci

      - name: Install extra vcpkg dependencies
        if: ${{ inputs.vcpkg_extra_dependencies != '' }}
        run: |
          JSON='${{inputs.vcpkg_extra_dependencies}}'
          DEPS=$(python3 -c "import json; data=json.loads(r'$JSON'); print(' '.join(data.get('${{ matrix.duckdb_arch }}', [])) if '${{ matrix.duckdb_arch }}' in data else '')" | tr -d '\n')
          if [ ! -z "$DEPS" ]; then
            for dep in $DEPS; do
              docker run --env-file=docker_env.txt -v `pwd`:/duckdb_build_dir duckdb/${{ matrix.duckdb_arch }} vcpkg install $dep --recurse
            done
          fi

      - name: Inject extra extension config
        if: ${{ inputs.extra_extension_config }}
        shell: bash
        env:
          EXTENSION_CONFIG: ${{ inputs.extra_extension_config }}
        run: |
          echo -e "\n# Injected Extension Config\n$EXTENSION_CONFIG" >> ./extension_config.cmake
          cat ./extension_config.cmake

      - name: Run configure (inside Docker)
        shell: bash
        run: |
          docker run --env-file=docker_env.txt -v `pwd`:/duckdb_build_dir -v `pwd`/ccache_dir:/ccache_dir duckdb/${{ matrix.duckdb_arch }} make configure_ci

      - name: Build extension (inside Docker)
        run: |
          docker run --env-file=docker_env.txt -v `pwd`:/duckdb_build_dir -v `pwd`/ccache_dir:/ccache_dir duckdb/${{ matrix.duckdb_arch }} make ${{ inputs.build_type }}

      # Haybarn: ccache stats live inside the container. Surface them to the
      # host log so we can monitor hit rates per leg (the same `ccache -s`
      # output that macOS/Windows/wasm legs print). Best-effort — failure
      # here shouldn't fail the build.
      - name: ccache stats (inside Docker)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          docker run --env-file=docker_env.txt -v `pwd`/ccache_dir:/ccache_dir duckdb/${{ matrix.duckdb_arch }} ccache -s -v || true

      # Haybarn: actions/cache/save dropped along with the corresponding
      # restore step above — R2 carries all ccache.
      - name: Test extension (inside docker)
        if: ${{ matrix.duckdb_arch != 'linux_arm64' && inputs.skip_tests == false }}
        run: |
          docker run --env-file=docker_env.txt -v `pwd`:/duckdb_build_dir -v `pwd`/ccache_dir:/ccache_dir duckdb/${{ matrix.duckdb_arch }} make test_${{ inputs.build_type }}

      - name: Test extension (outside docker)
        if: ${{ matrix.duckdb_arch != 'linux_arm64' && inputs.skip_tests == false }}
        env:
          DUCKDB_GIT_VERSION: ${{ inputs.duckdb_version }}
          LINUX_CI_IN_DOCKER: 0
          SUBSET_EXTENSIONS_TESTS: ${{ inputs.extensions_test_selection }}
        run: |
          eval "$(jq -r '.test_env_variables // {} | to_entries[] | "export \(.key)=\(.value | @sh)"' <<< '${{inputs.test_config}}')"
          make test_${{ inputs.build_type }}

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.upload_all_extensions }}
        with:
          if-no-files-found: error
          name: ${{ inputs.extension_name }}-${{ inputs.duckdb_version }}-extension-${{matrix.duckdb_arch}}${{inputs.artifact_postfix}}
          path: |
            build/${{ inputs.build_type }}/extension/${{ inputs.extension_name }}/${{ inputs.extension_name }}.duckdb_extension

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.upload_all_extensions }}
        with:
          if-no-files-found: error
          name: ${{ inputs.extension_name }}-${{ inputs.duckdb_version }}-extension-${{matrix.duckdb_arch}}${{inputs.artifact_postfix}}
          path: |
            build/${{ inputs.build_type }}/repository/**/*.duckdb_extension

      - name: Print Rust logs
        if: ${{ inputs.rust_logs && (inputs.enable_rust || contains(format(';{0};', inputs.extra_toolchains), ';rust;')) }}
        run: |
          for filename in build/${{ inputs.build_type }}/rust/src/*/*build-*.log; do
            echo Printing logs for file $filename
            cat $filename;
            echo Done printing logs for $filename
          done

  macos:
    name: MacOS
    runs-on: macos-latest
    needs:
      - generate_matrix
    if: |
      always() &&
      !cancelled() &&
      needs.generate_matrix.outputs.osx_matrix != '{}' &&
      needs.generate_matrix.outputs.osx_matrix != '' &&
      needs.generate_matrix.result == 'success'
    strategy:
      matrix: ${{fromJson(needs.generate_matrix.outputs.osx_matrix)}}
    env:
      # Haybarn: see comment in the linux job for why this is set.
      OVERRIDE_GIT_DESCRIBE: ${{ startsWith(inputs.duckdb_version, 'haybarn-v1.5.2') && 'v1.5.2' || inputs.duckdb_version }}
      # VCPKG config
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_target_triplet }}
      VCPKG_HOST_TRIPLET: ${{ matrix.vcpkg_host_triplet }}
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/extension-ci-tools/vcpkg_ports
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/extension-ci-tools/toolchains
      USE_MERGED_VCPKG_MANIFEST: ${{ inputs.use_merged_vcpkg_manifest }}
      # VCPKG caching
      AWS_ACCESS_KEY_ID: ${{ secrets.VCPKG_CACHING_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VCPKG_CACHING_AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.VCPKG_CACHING_AWS_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ secrets.VCPKG_CACHING_AWS_DEFAULT_REGION }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      # Misc
      OSX_BUILD_ARCH: ${{ matrix.osx_build_arch }}
      GEN: ninja
      BUILD_SHELL: ${{ inputs.build_duckdb_shell && '1' || '0' }}
      DUCKDB_PLATFORM: ${{ matrix.duckdb_arch }}
      # Haybarn: ccache tuning — strip absolute workspace prefix from hashes
      # (so vcpkg's per-run buildtrees temp paths and per-run cwd shifts don't
      # bust the cache), tolerate __DATE__/__TIME__/header-mtime variance, and
      # hash the compiler binary content (survives toolchain reinstalls of
      # the same version).
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_SLOPPINESS: "time_macros,include_file_mtime,pch_defines"
      CCACHE_COMPILERCHECK: "content"
      # Remote ccache via Cloudflare Worker → R2 (same bucket/auth as vcpkg).
      # Local cache stays L1; R2 is L2 shared across repos/runners/branches —
      # survives GH cache flakiness + outlives any single repo's cache scope.
      CCACHE_REMOTE_STORAGE: "http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.vcpkg_token }}|connect-timeout=10000|operation-timeout=30000"

    steps:
      - uses: actions/checkout@v6
        name: Checkout override repository
        if: ${{inputs.override_repository != ''}}
        with:
          repository: ${{ inputs.override_repository }}
          ref: ${{ inputs.override_ref }}
          fetch-depth: 0
          submodules: recursive   # Haybarn: many real community extensions (h3, scrooge, etc.) have submodules that are load-bearing for the build (CMakeLists.txt does `add_subdirectory(<submodule>)`). The old `submodules: false` optimization was safe for the canonical extension-template (no real submodules) but failed for real extensions: e.g. h3's CMakeLists does `add_subdirectory(h3)` against an h3-library submodule. Recursive is slower per leg but correct in the general case.

      - uses: actions/checkout@v6
        name: Checkout current repository
        if: ${{inputs.override_repository == ''}}
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install Ninja
        run: |
          brew install ninja autoconf make libtool automake autoconf-archive

      # macos-latest is Apple Silicon where brew lives at /opt/homebrew/bin/brew.
      # Some upstream extension CMakeLists files (notably duckdb-odbc /
      # odbc_scanner) hardcode the Intel path /usr/local/bin/brew and fail at
      # configure with "/bin/bash: /usr/local/bin/brew: No such file or
      # directory" on arm64. Drop a wrapper there that exec's the real brew
      # (using `exec` so brew's self-locate logic sees its true /opt/homebrew
      # path — a plain symlink confuses other tools like ccache-action).
      #
      # Scoped to osx_arm64 only: the osx_amd64 cross-build path installs a
      # separate Intel Homebrew at /usr/local naturally via the "Install
      # unixODBC (amd64)" step below, and we don't want to clobber that.
      - name: Brew compat shim (osx_arm64 only)
        if: runner.os == 'macOS' && matrix.duckdb_arch == 'osx_arm64'
        run: |
          if [ -x /opt/homebrew/bin/brew ] && [ ! -e /usr/local/bin/brew ]; then
            sudo mkdir -p /usr/local/bin
            sudo tee /usr/local/bin/brew >/dev/null <<'SHIM'
          #!/bin/bash
          exec /opt/homebrew/bin/brew "$@"
          SHIM
            sudo chmod +x /usr/local/bin/brew
          fi
          /usr/local/bin/brew --prefix || true

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        continue-on-error: true
        with:
          key: ccache-extension-distribution-${{ matrix.duckdb_arch }}-${{ inputs.duckdb_version }}
          restore-keys: ccache-extension-distribution-${{ matrix.duckdb_arch }}-
          # Haybarn: GH cache disabled — empirically thrashed under high-churn
          # parallel community ext builds (10GB cap, LRU eviction). R2 is the
          # only ccache backend now. The action is still useful for installing
          # the ccache binary and setting CCACHE_DIR, just not for L1 cache.
          save: 'false'
          read-only: 'true'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/checkout@v6
        name: Checkout Extension CI tools
        with:
          path: 'extension-ci-tools'
          ref: ${{ inputs.ci_tools_version }}
          repository: ${{ inputs.override_ci_tools_repository }}

      - name: Fetch override repository
        if: ${{inputs.override_duckdb_repository != ''}}
        run: |
          rm -rf duckdb && git clone --depth=1 --branch "${{ inputs.duckdb_version }}" --single-branch "${{ inputs.override_duckdb_repository }}" duckdb

      - name: Set DuckDB to ref of calling workflow
        if: ${{inputs.set_caller_as_duckdb}}
        uses: actions/checkout@v6
        with:
          path: 'duckdb'
          fetch-tags: true
          fetch-depth: 0

      - name: Checkout DuckDB to version
        if: ${{ inputs.duckdb_version != '' }}
        run: |
          (cd duckdb && git checkout "${{ inputs.duckdb_version }}")

      - name: Tag extension
        if: ${{inputs.extension_tag != ''}}
        run: |
          git tag ${{ inputs.extension_tag }}

      - name: Tag DuckDB extension
        if: ${{inputs.duckdb_tag != ''}}
        run: |
          DUCKDB_TAG=${{ inputs.duckdb_tag }} make set_duckdb_tag

      - name: Setup vcpkg
        run: |
          mkdir local_vcpkg_installation
          cmake --version
          cd local_vcpkg_installation
          git init
          git remote add origin ${{ inputs.vcpkg_url }}
          git fetch origin ${{ inputs.vcpkg_commit }}
          git checkout ${{ inputs.vcpkg_commit }}
          ./bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=${{ github.workspace }}/local_vcpkg_installation" >> $GITHUB_ENV
          echo "VCPKG_TOOLCHAIN_PATH=${{ github.workspace }}/local_vcpkg_installation/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
          echo "${{ github.workspace }}/local_vcpkg_installation" >> $GITHUB_PATH

      - name: Install Rust cross compile dependency
        if: ${{ (inputs.enable_rust || contains(format(';{0};', inputs.extra_toolchains), ';rust;')) && matrix.osx_build_arch == 'x86_64'}}
        run: |
          rustup target add x86_64-apple-darwin

      - name: Install Fortran
        if: ${{ (contains(format(';{0};', inputs.extra_toolchains), ';fortran;')) }}
        run: |
          brew install gcc

      - name: 'Setup go'
        if: ${{ (inputs.enable_go || contains(format(';{0};', inputs.extra_toolchains), ';go;'))}}
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Install parser tools
        if: ${{ contains(format(';{0};', inputs.extra_toolchains), ';parser_tools;')}}
        run: |
          brew install bison flex

      - name: Inject extra extension config
        if: ${{ inputs.extra_extension_config }}
        shell: bash
        env:
          EXTENSION_CONFIG: ${{ inputs.extra_extension_config }}
        run: |
          echo -e "\n# Injected Extension Config\n$EXTENSION_CONFIG" >> ./extension_config.cmake
          cat ./extension_config.cmake

      - name: install omp (x86)
        if: ${{ contains(format(';{0};', inputs.extra_toolchains), ';omp;') && matrix.duckdb_arch == 'osx_amd64' }}
        run: |
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install.sh)"
          (echo; echo 'eval "$(/usr/local/bin/brew shellenv)"') >> /Users/runner/.bash_profile
          eval "$(/usr/local/bin/brew shellenv)"
          arch -x86_64 brew install libomp
          echo "LDFLAGS=-L/usr/local/opt/libomp/lib" >> $GITHUB_ENV
          echo "CFLAGS=-I/usr/local/opt/libomp/include" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/usr/local/opt/libomp/include" >> $GITHUB_ENV
          echo "CXXFLAGS=-I/usr/local/opt/libomp/include" >> $GITHUB_ENV

      - name: install omp (arm)
        if: ${{ contains(format(';{0};', inputs.extra_toolchains), ';omp;') && matrix.duckdb_arch == 'osx_arm64' }}
        run: |
          brew install libomp
          echo "LDFLAGS=-L/opt/homebrew/opt/libomp/lib" >> $GITHUB_ENV
          echo "CFLAGS=-I/opt/homebrew/opt/libomp/include" >> $GITHUB_ENV
          echo "CPPFLAGS=-I/opt/homebrew/opt/libomp/include" >> $GITHUB_ENV
          echo "CXXFLAGS=-I/opt/homebrew/opt/libomp/include" >> $GITHUB_ENV

      - name: Install unixODBC (arm64)
        if: ${{ contains(format(';{0};', inputs.extra_toolchains), ';unixodbc;') && matrix.duckdb_arch == 'osx_arm64' }}
        run: |
          brew config
          brew install unixodbc
          brew ls -v unixodbc

      - name: Install unixODBC (amd64)
        if: ${{ contains(format(';{0};', inputs.extra_toolchains), ';unixodbc;') && matrix.duckdb_arch == 'osx_amd64' }}
        run: |
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          /usr/local/bin/brew config
          /usr/local/bin/brew install unixodbc
          /usr/local/bin/brew ls -v unixodbc

      - name: Override AWS CLI
        if: ${{ (contains(format(';{0};', inputs.extra_toolchains), ';downgraded_aws_cli;')) }}
        shell: bash
        run: |
          curl https://awscli.amazonaws.com/AWSCLIV2-2.22.35.pkg -o ./AWSCLIV2.pkg
          sudo installer -pkg ./AWSCLIV2.pkg -target /
          aws --version

      - name: Run configure
        shell: bash
        env:
          DUCKDB_GIT_VERSION: ${{ inputs.duckdb_version }}
        run: |
          make configure_ci

      - name: Install extra vcpkg dependencies
        if: ${{ inputs.vcpkg_extra_dependencies != '' }}
        run: |
          JSON='${{inputs.vcpkg_extra_dependencies}}'
          DEPS=$(python3 -c "import json; data=json.loads(r'$JSON'); print(' '.join(data.get('${{ matrix.duckdb_arch }}', [])) if '${{ matrix.duckdb_arch }}' in data else '')" | tr -d '\n')
          if [ ! -z "$DEPS" ]; then
            for dep in $DEPS; do
              vcpkg install "$dep" --recurse
            done
          fi

      - name: Build extension
        shell: bash
        run: |
          EXTENSION_NAME=${{ inputs.extension_name }} EXTENSION_CANONICAL=${{ inputs.extension_canonical }} ENABLE_EXTENSION_AUTOINSTALL=1 ENABLE_EXTENSION_AUTOLOADING=1 make ${{ inputs.build_type }}

      - name: Test Extension
        if: ${{ matrix.osx_build_arch == 'arm64' && inputs.skip_tests == false }}
        env:
          SUBSET_EXTENSIONS_TESTS: ${{ inputs.extensions_test_selection }}
        shell: bash
        run: |
          eval "$(jq -r '.test_env_variables // {} | to_entries[] | "export \(.key)=\(.value | @sh)"' <<< '${{inputs.test_config}}')"
          make test_${{ inputs.build_type }}

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.upload_all_extensions }}
        with:
          if-no-files-found: error
          name: ${{ inputs.extension_name }}-${{ inputs.duckdb_version }}-extension-${{matrix.duckdb_arch}}${{inputs.artifact_postfix}}
          path: |
            build/${{ inputs.build_type }}/extension/${{ inputs.extension_name }}/${{ inputs.extension_name }}.duckdb_extension

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.upload_all_extensions }}
        with:
          if-no-files-found: error
          name: ${{ inputs.extension_name }}-${{ inputs.duckdb_version }}-extension-${{matrix.duckdb_arch}}${{inputs.artifact_postfix}}
          path: |
            build/${{ inputs.build_type }}/repository/**/*.duckdb_extension

      - name: Print Rust logs
        if: ${{ inputs.rust_logs && (inputs.enable_rust || contains(format(';{0};', inputs.extra_toolchains), ';rust;')) }}
        run: |
          for filename in build/${{ inputs.build_type }}/rust/src/*/*build-*.log; do
            echo Printing logs for file $filename
            cat $filename;
            echo Done printing logs for $filename
          done

  windows:
    name: Windows
    runs-on: ${{ matrix.runner }}
    needs:
      - generate_matrix
    if: |
      always() &&
      !cancelled() &&
      needs.generate_matrix.outputs.windows_matrix != '{}' &&
      needs.generate_matrix.outputs.windows_matrix != '' &&
      needs.generate_matrix.result == 'success'
    strategy:
      matrix: ${{fromJson(needs.generate_matrix.outputs.windows_matrix)}}
    env:
      # Haybarn: see comment in the linux job for why this is set.
      OVERRIDE_GIT_DESCRIBE: ${{ startsWith(inputs.duckdb_version, 'haybarn-v1.5.2') && 'v1.5.2' || inputs.duckdb_version }}
      # VCPKG config
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_target_triplet }}
      VCPKG_HOST_TRIPLET: ${{ matrix.vcpkg_host_triplet }}
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/extension-ci-tools/vcpkg_ports
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/extension-ci-tools/toolchains
      USE_MERGED_VCPKG_MANIFEST: ${{ inputs.use_merged_vcpkg_manifest }}
      # VCPKG caching
      AWS_ACCESS_KEY_ID: ${{ secrets.VCPKG_CACHING_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VCPKG_CACHING_AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.VCPKG_CACHING_AWS_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ secrets.VCPKG_CACHING_AWS_DEFAULT_REGION }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      # Misc
      BUILD_SHELL: ${{ inputs.build_duckdb_shell && '1' || '0' }}
      DUCKDB_PLATFORM: ${{ matrix.duckdb_arch }}
      CC: ${{ (matrix.duckdb_arch == 'windows_amd64_rtools' || matrix.duckdb_arch == 'windows_amd64_mingw') && 'gcc' || 'cl' }}
      CXX: ${{ (matrix.duckdb_arch == 'windows_amd64_rtools' || matrix.duckdb_arch == 'windows_amd64_mingw') && 'g++' || 'cl' }}
      GEN: ninja
      # Haybarn: ccache tuning + remote backend for Windows. CMAKE_*_COMPILER_LAUNCHER
      # only works with non-MSBuild generators — GEN=ninja above satisfies that.
      # ccache 4.6+ supports MSVC; chocolatey ships a recent version. ccache-action
      # below installs it and sets CCACHE_DIR; the remaining env knobs match Linux/macOS.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_SLOPPINESS: "time_macros,include_file_mtime,pch_defines"
      CCACHE_COMPILERCHECK: "content"
      # NOTE: CCACHE_COMPILERTYPE intentionally NOT set here — the matrix
      # spans both cl.exe (windows_amd64) and gcc/g++ (windows_amd64_mingw,
      # windows_amd64_rtools); ccache's auto-detect handles both correctly.
      CCACHE_REMOTE_STORAGE: "http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.vcpkg_token }}|connect-timeout=10000|operation-timeout=30000"
      # Pass `-DCMAKE_*_COMPILER_LAUNCHER=ccache` through the duckdb Makefile so
      # cmake wraps the compiler. The Makefile honors COMMON_CMAKE_VARS env.
      COMMON_CMAKE_VARS: "-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"

    steps:
      # Haybarn: disable Windows Defender real-time monitoring + add path
      # exclusions for the dirs we touch heavily (rtools install, vcpkg
      # buildtrees, chocolatey installs, the workspace). Small-file-IO is
      # the dominant cost on the Windows-mingw leg (rtools install alone
      # spends ~2:48 of dead-air installing thousands of files; Defender
      # callbacks on every write add up). Status is logged before and
      # after the disable attempt: stock Defender flips
      # RealTimeProtectionEnabled to False; MDE (tamper-protected, deployed
      # to some GHA runner pools) silently no-ops the disable but still
      # respects exclusion paths, so we add those as a belt-and-suspenders.
      - name: Disable Defender real-time scan + add path exclusions
        shell: pwsh
        run: |
          Write-Host "::group::Defender state BEFORE"
          Get-MpComputerStatus | Select-Object `
            RealTimeProtectionEnabled, IsTamperProtected, `
            AntispywareEnabled, AntivirusEnabled, `
            AMServiceEnabled, AMEngineVersion, AMProductVersion, `
            IoavProtectionEnabled, OnAccessProtectionEnabled `
            | Format-List
          Write-Host "::endgroup::"
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Stop
            Write-Host "Set-MpPreference: ok"
          } catch {
            Write-Host "Set-MpPreference threw (likely MDE-tamper-protected): $_"
          }
          try {
            Add-MpPreference -ExclusionPath 'C:\rtools42','C:\rtools43','C:\rtools44','D:\a','C:\ProgramData\Chocolatey' -ErrorAction Stop
            Write-Host "Add-MpPreference exclusions: ok"
          } catch {
            Write-Host "Add-MpPreference threw: $_"
          }
          Write-Host "::group::Defender state AFTER"
          Get-MpComputerStatus | Select-Object `
            RealTimeProtectionEnabled, IsTamperProtected `
            | Format-List
          Get-MpPreference | Select-Object -ExpandProperty ExclusionPath
          Write-Host "::endgroup::"

      - name: Downgrade AWS cli
        shell: powershell
        if: ${{ (contains(format(';{0};', inputs.extra_toolchains), ';downgraded_aws_cli;')) }}
        run: |
          $app = Get-WmiObject -Class Win32_Product -Filter "Name LIKE 'AWS Command Line Interface%'"
          if ($app) { $app.Uninstall() }
          msiexec.exe /i https://awscli.amazonaws.com/AWSCLIV2-2.22.35.msi  /qn
          sleep 60

      - name: Test AWS cli version
        shell: powershell
        run: |
          aws --version

      - name: Keep \n line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@v6
        name: Checkout override repository
        if: ${{inputs.override_repository != ''}}
        with:
          repository: ${{ inputs.override_repository }}
          ref: ${{ inputs.override_ref }}
          fetch-depth: 0
          submodules: recursive   # Haybarn: many real community extensions (h3, scrooge, etc.) have submodules that are load-bearing for the build (CMakeLists.txt does `add_subdirectory(<submodule>)`). The old `submodules: false` optimization was safe for the canonical extension-template (no real submodules) but failed for real extensions: e.g. h3's CMakeLists does `add_subdirectory(h3)` against an h3-library submodule. Recursive is slower per leg but correct in the general case.

      - uses: actions/checkout@v6
        name: Checkout current repository
        if: ${{inputs.override_repository == ''}}
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Rust
        if: (inputs.enable_rust || contains(format(';{0};', inputs.extra_toolchains), ';rust;'))
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust for Mingw
        if: (inputs.enable_rust || contains(format(';{0};', inputs.extra_toolchains), ';rust;')) && matrix.duckdb_arch == 'windows_amd64_rtools' || matrix.duckdb_arch == 'windows_amd64_mingw'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: 'Setup go'
        if: ${{ (inputs.enable_go || contains(format(';{0};', inputs.extra_toolchains), ';go;'))}}
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Install parser tools
        if: ${{ contains(format(';{0};', inputs.extra_toolchains), ';parser_tools;')}}
        run: |
          choco install winflexbison3

      - name: Install Ninja build tool
        run: |
          choco install ninja -y

      - name: Install jq
        run: |
          choco install jq -y

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@main
        continue-on-error: true
        with:
          key: ccache-extension-distribution-${{ matrix.duckdb_arch }}-${{ inputs.duckdb_version }}
          restore-keys: ccache-extension-distribution-${{ matrix.duckdb_arch }}-
          # Haybarn: GH cache disabled — empirically thrashed under high-churn
          # parallel community ext builds (10GB cap, LRU eviction). R2 is the
          # only ccache backend now. The action is still useful for installing
          # the ccache binary and setting CCACHE_DIR, just not for L1 cache.
          save: 'false'
          read-only: 'true'

      - name: Upgrade ccache to 4.13.6 on Windows (HTTP backend bearer auth fix)
        # Same fix as the wasm leg — `hendrikmuhs/ccache-action` installs
        # ccache 4.9.1 via chocolatey on windows-latest, whose HTTP backend
        # silently fails bearer-token PUTs, so the remote cache never warms.
        # 4.13.6 fixes the auth flow. Drop the upstream-release Windows ccache
        # binary on top of whatever ccache-action installed; on Windows we put
        # it in C:\ProgramData\chocolatey\bin so it wins on PATH.
        # The non-mingw windows runner has cl.exe (MSVC); CCACHE_COMPILERTYPE=msvc
        # tells ccache 4.6+ to wrap cl.exe natively (already set in the env
        # block via CIBW or directly by callers).
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          CCACHE_VERSION=4.13.6
          # Windows-x86_64 build is published by the upstream ccache project.
          curl -fsSL "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/ccache-${CCACHE_VERSION}-windows-x86_64.zip" -o /tmp/ccache.zip
          unzip -j -o /tmp/ccache.zip "ccache-${CCACHE_VERSION}-windows-x86_64/ccache.exe" -d /tmp/
          # Place ahead of the chocolatey-installed copy on PATH.
          mv /tmp/ccache.exe "/c/ProgramData/chocolatey/bin/ccache.exe"
          ccache --version
          which ccache

      - uses: r-lib/actions/setup-r@v2
        if:  matrix.duckdb_arch == 'windows_amd64_rtools' || matrix.duckdb_arch == 'windows_amd64_mingw'
        with:
          r-version: 'devel'
          update-rtools: true
          rtools-version: '42' # linker bug in 43

      - name: setup rtools gcc for vcpkg
        if:  matrix.duckdb_arch == 'windows_amd64_rtools' || matrix.duckdb_arch == 'windows_amd64_mingw'
        run: |
          cp C:/rtools42/x86_64-w64-mingw32.static.posix/bin/gcc.exe C:/rtools42/x86_64-w64-mingw32.static.posix/bin/x86_64-w64-mingw32-gcc.exe
          cp C:/rtools42/x86_64-w64-mingw32.static.posix/bin/g++.exe C:/rtools42/x86_64-w64-mingw32.static.posix/bin/x86_64-w64-mingw32-g++.exe
          cp C:/rtools42/x86_64-w64-mingw32.static.posix/bin/gfortran.exe C:/rtools42/x86_64-w64-mingw32.static.posix/bin/x86_64-w64-mingw32-gfortran.exe

      - uses: actions/checkout@v6
        name: Checkout Extension CI tools
        with:
          path: 'extension-ci-tools'
          ref: ${{ inputs.ci_tools_version }}
          repository: ${{ inputs.override_ci_tools_repository }}

      - name: Fetch override repository
        if: ${{inputs.override_duckdb_repository != ''}}
        shell: bash
        run: |
          rm -rf duckdb && git clone --depth=1 --branch "${{ inputs.duckdb_version }}" --single-branch "${{ inputs.override_duckdb_repository }}" duckdb

      - name: Set DuckDB to ref of calling workflow
        if: ${{inputs.set_caller_as_duckdb}}
        uses: actions/checkout@v6
        with:
          path: 'duckdb'
          fetch-tags: true
          fetch-depth: 0

      - name: Checkout DuckDB to version
        if: ${{ inputs.duckdb_version != '' }}
        shell: bash
        run: |
          (cd duckdb && git checkout "${{ inputs.duckdb_version }}")

      - name: Tag extension
        if: ${{inputs.extension_tag != ''}}
        run: |
          git tag ${{ inputs.extension_tag }}

      - name: Tag DuckDB extension
        if: ${{inputs.duckdb_tag != ''}}
        env:
          DUCKDB_TAG: ${{ inputs.duckdb_tag }}
        run: |
          make set_duckdb_tag

      - name: Setup shorter path for vcpkg
        run: |
          $basePath = Split-Path -Path (Split-path -Path $env:GITHUB_WORKSPACE -Parent) -Parent
          $vcpkgRoot = "$basePath/vcpkg"
          echo "VCPKG_WINDOWS_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          echo "VCPKG_TOOLCHAIN_PATH=$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: ${{ inputs.vcpkg_commit }}
          vcpkgGitURL: ${{ inputs.vcpkg_url }}
          vcpkgDirectory: ${{ env.VCPKG_WINDOWS_ROOT }}

      - name: Inject extra extension config
        if: ${{ inputs.extra_extension_config }}
        shell: bash
        env:
          EXTENSION_CONFIG: ${{ inputs.extra_extension_config }}
        run: |
          echo -e "\n# Injected Extension Config\n$EXTENSION_CONFIG" >> ./extension_config.cmake
          cat ./extension_config.cmake

      - name: Run configure
        shell: bash
        env:
          DUCKDB_PLATFORM: ${{ matrix.duckdb_arch }}
          DUCKDB_PLATFORM_RTOOLS: ${{ (matrix.duckdb_arch == 'windows_amd64_rtools' || matrix.duckdb_arch == 'windows_amd64_mingw') && 1 || 0 }}
          DUCKDB_GIT_VERSION: ${{ inputs.duckdb_version }}
        run: |
          make configure_ci

      - name: Install extra vcpkg dependencies
        shell: bash
        if: ${{ inputs.vcpkg_extra_dependencies != '' }}
        run: |
          JSON='${{inputs.vcpkg_extra_dependencies}}'
          DEPS=$(python3 -c "import json; data=json.loads(r'$JSON'); print(' '.join(data.get('${{ matrix.duckdb_arch }}', [])) if '${{ matrix.duckdb_arch }}' in data else '')" | tr -d '\n')
          echo $DEPS
          if [ ! -z "$DEPS" ]; then
            for dep in $DEPS; do
              vcpkg install "$dep" --recurse
            done
          fi

      - name: Build extension
        env:
          DUCKDB_PLATFORM: ${{ matrix.duckdb_arch }}
          EXTENSION_NAME: ${{ inputs.extension_name }}
          EXTENSION_CANONICAL: ${{ inputs.extension_canonical }}
          ENABLE_EXTENSION_AUTOINSTALL: 1
          ENABLE_EXTENSION_AUTOLOADING: 1
          DUCKDB_PLATFORM_RTOOLS: ${{ (matrix.duckdb_arch == 'windows_amd64_rtools' || matrix.duckdb_arch == 'windows_amd64_mingw') && 1 || 0 }}
          EXT_FLAGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        shell: cmd
        run: |
          setlocal EnableDelayedExpansion
          if "%DUCKDB_PLATFORM_RTOOLS%" == "0" (
            set "VCVARS_BAT="
            if "%DUCKDB_PLATFORM%" == "windows_amd64" (
              set "VCVARS_BAT=vcvars64.bat"
            )
            if "%DUCKDB_PLATFORM%" == "windows_arm64" (
              set "VCVARS_BAT=vcvarsarm64.bat"
            )
            if defined VCVARS_BAT (
              if exist "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\!VCVARS_BAT!" (
                call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\!VCVARS_BAT!"
              ) else (
                call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\!VCVARS_BAT!"
              )
            )
            REM Rename link.exe to link-git.exe to avoid conflicts with git supplied linker.
            mv "C:\Program Files\Git\usr\bin\link.exe" "C:\Program Files\Git\usr\bin\link-git.exe"
          )
          make ${{ inputs.build_type }}

      - name: Test extension
        if: ${{ inputs.skip_tests == false }}
        shell: bash
        env:
          DUCKDB_PLATFORM: ${{ matrix.duckdb_arch }}
          DUCKDB_PLATFORM_RTOOLS: ${{ (matrix.duckdb_arch == 'windows_amd64_rtools' || matrix.duckdb_arch == 'windows_amd64_mingw') && 1 || 0 }}
          SUBSET_EXTENSIONS_TESTS: ${{ inputs.extensions_test_selection }}
        run: |
          eval "$(jq -r '.test_env_variables // {} | to_entries[] | "export \(.key)=\(.value | @sh)"' <<< '${{inputs.test_config}}')"
          make test_${{ inputs.build_type }}

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.upload_all_extensions }}
        with:
          if-no-files-found: error
          name: ${{ inputs.extension_name }}-${{ inputs.duckdb_version }}-extension-${{matrix.duckdb_arch}}${{inputs.artifact_postfix}}
          path: |
            build/${{ inputs.build_type }}/extension/${{ inputs.extension_name }}/${{ inputs.extension_name }}.duckdb_extension

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.upload_all_extensions }}
        with:
          if-no-files-found: error
          name: ${{ inputs.extension_name }}-${{ inputs.duckdb_version }}-extension-${{matrix.duckdb_arch}}${{inputs.artifact_postfix}}
          path: |
            build/${{ inputs.build_type }}/repository/**/*.duckdb_extension

      - name: Print Rust logs
        if: ${{ inputs.rust_logs && (inputs.enable_rust || contains(format(';{0};', inputs.extra_toolchains), ';rust;')) }}
        shell: bash
        run: |
          for filename in build/${{ inputs.build_type }}/rust/src/*/*build-*.log; do
            echo Printing logs for file $filename
            cat $filename;
            echo Done printing logs for $filename
          done

      - name: Move rtools supplied zstd out of the way, so ccache can work
        if: (matrix.duckdb_arch == 'windows_amd64_rtools' || matrix.duckdb_arch == 'windows_amd64_mingw')
        shell: cmd
        run: |
          mv C:\rtools42\usr\bin\zstd.exe C:\rtools42\usr\bin\zstd-rtools.exe

  wasm:
    name: DuckDB-Wasm
    runs-on: ubuntu-latest
    needs:
      - generate_matrix
    if: |
      always() &&
      !cancelled() &&
      needs.generate_matrix.outputs.wasm_matrix != '{}' &&
      needs.generate_matrix.outputs.wasm_matrix != '' &&
      needs.generate_matrix.result == 'success'
    strategy:
      matrix: ${{fromJson(needs.generate_matrix.outputs.wasm_matrix)}}
    env:
      # Haybarn: see comment in the linux job for why this is set.
      OVERRIDE_GIT_DESCRIBE: ${{ startsWith(inputs.duckdb_version, 'haybarn-v1.5.2') && 'v1.5.2' || inputs.duckdb_version }}
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_target_triplet }}
      VCPKG_HOST_TRIPLET: ${{ matrix.vcpkg_host_triplet }}
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      USE_MERGED_VCPKG_MANIFEST: ${{ inputs.use_merged_vcpkg_manifest }}
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/extension-ci-tools/vcpkg_ports
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/extension-ci-tools/toolchains
      # VCPKG caching
      AWS_ACCESS_KEY_ID: ${{ secrets.VCPKG_CACHING_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VCPKG_CACHING_AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.VCPKG_CACHING_AWS_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ secrets.VCPKG_CACHING_AWS_DEFAULT_REGION }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required

      DUCKDB_PLATFORM: ${{ matrix.duckdb_arch }}
      WASM_EXTENSIONS: 1
      # Haybarn: CCACHE_BASEDIR is /home/runner (not ${{ github.workspace }}),
      # widened to cover the emsdk install path. `mymindstorm/setup-emsdk@v13`
      # installs to `/home/runner/work/_temp/<random UUID>/emsdk-main/`, where
      # the UUID changes every run. emcc invocations therefore have a unique
      # absolute path each time, defeating ccache's content-hash unless the
      # basedir normalizes it. Widening to /home/runner strips the variable
      # part of the path and lets cache keys repeat across runs.
      # See https://ccache.dev/manual/4.13.html#_compiling_in_different_directories.
      CCACHE_BASEDIR: /home/runner
      CCACHE_NOHASHDIR: "1"
      CCACHE_SLOPPINESS: "time_macros,include_file_mtime,pch_defines"
      CCACHE_COMPILERCHECK: "content"
      # Remote ccache via Cloudflare Worker → R2. See macos block for rationale.
      CCACHE_REMOTE_STORAGE: "http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.vcpkg_token }}|connect-timeout=10000|operation-timeout=30000"

    steps:
      - uses: actions/checkout@v6
        name: Checkout override repository
        if: ${{inputs.override_repository != ''}}
        with:
          repository: ${{ inputs.override_repository }}
          ref: ${{ inputs.override_ref }}
          fetch-depth: 0
          submodules: recursive   # Haybarn: many real community extensions (h3, scrooge, etc.) have submodules that are load-bearing for the build (CMakeLists.txt does `add_subdirectory(<submodule>)`). The old `submodules: false` optimization was safe for the canonical extension-template (no real submodules) but failed for real extensions: e.g. h3's CMakeLists does `add_subdirectory(h3)` against an h3-library submodule. Recursive is slower per leg but correct in the general case.

      - uses: actions/checkout@v6
        name: Checkout current repository
        if: ${{inputs.override_repository == ''}}
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - uses: actions/checkout@v6
        name: Checkout Extension CI tools
        with:
          path: 'extension-ci-tools'
          ref: ${{ inputs.ci_tools_version }}
          repository: ${{ inputs.override_ci_tools_repository }}

      - name: Fetch override repository
        if: ${{inputs.override_duckdb_repository != ''}}
        run: |
          rm -rf duckdb && git clone --depth=1 --branch "${{ inputs.duckdb_version }}" --single-branch "${{ inputs.override_duckdb_repository }}" duckdb

      - name: Set DuckDB to ref of calling workflow
        if: ${{inputs.set_caller_as_duckdb}}
        uses: actions/checkout@v6
        with:
          path: 'duckdb'
          fetch-tags: true
          fetch-depth: 0

      - name: Checkout DuckDB to version
        if: ${{ inputs.duckdb_version != '' }}
        run: |
          (cd duckdb && git checkout "${{ inputs.duckdb_version }}")

      - name: Tag extension
        if: ${{inputs.extension_tag != ''}}
        run: |
          git tag ${{ inputs.extension_tag }}

      - name: Tag DuckDB extension
        if: ${{inputs.duckdb_tag != ''}}
        run: |
          DUCKDB_TAG=${{ inputs.duckdb_tag }} make set_duckdb_tag

      # Inline toolchain setup — skipped when use_prebuilt_wasm_image is true
      # (in that case emsdk + vcpkg + ccache 4.13.6 all come baked in the
      # ghcr.io/.../haybarn-wasm:<tag> image).
      - uses: mymindstorm/setup-emsdk@v13
        if: ${{ !inputs.use_prebuilt_wasm_image }}
        with:
          version: 3.1.71

      - name: Setup Rust for cross compilation
        if: ${{ (inputs.enable_rust || contains(format(';{0};', inputs.extra_toolchains), ';rust;'))}}
        uses: dtolnay/rust-toolchain@1.86.0
        with:
          targets: wasm32-unknown-emscripten

      - name: 'Setup go'
        if: ${{ (inputs.enable_go || contains(format(';{0};', inputs.extra_toolchains), ';go;'))}}
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'

      - name: Setup vcpkg
        if: ${{ !inputs.use_prebuilt_wasm_image }}
        run: |
          mkdir local_vcpkg_installation
          cmake --version
          cd local_vcpkg_installation
          git init
          git remote add origin ${{ inputs.vcpkg_url }}
          git fetch origin ${{ inputs.vcpkg_commit }}
          git checkout ${{ inputs.vcpkg_commit }}
          ./bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=${{ github.workspace }}/local_vcpkg_installation" >> $GITHUB_ENV
          echo "VCPKG_TOOLCHAIN_PATH=${{ github.workspace }}/local_vcpkg_installation/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
          echo "${{ github.workspace }}/local_vcpkg_installation" >> $GITHUB_PATH

      - name: Setup Ccache
        if: ${{ !inputs.use_prebuilt_wasm_image }}
        uses: hendrikmuhs/ccache-action@main
        continue-on-error: true
        with:
          key: ccache-extension-distribution-${{ matrix.duckdb_arch }}-${{ inputs.duckdb_version }}
          restore-keys: ccache-extension-distribution-${{ matrix.duckdb_arch }}-
          # Haybarn: GH cache disabled — empirically thrashed under high-churn
          # parallel community ext builds (10GB cap, LRU eviction). R2 is the
          # only ccache backend now. The action is still useful for installing
          # the ccache binary and setting CCACHE_DIR, just not for L1 cache.
          save: 'false'
          read-only: 'true'

      - name: Upgrade ccache to 4.13.6 (HTTP backend bearer auth fix)
        # hendrikmuhs/ccache-action installs ccache from apt — ubuntu-latest
        # ships 4.9.1 in apt as of 2026-05, whose HTTP storage backend has
        # buggy bearer-token write handling: writes silently fail and the
        # remote cache never populates → 100% remote miss on every wasm
        # build, forever. 4.13.6 (matching the manylinux container build)
        # fixes the auth flow. Drop /usr/local/bin/ccache on top of whatever
        # ccache-action installed — that binary takes precedence in PATH.
        if: ${{ !inputs.use_prebuilt_wasm_image }}
        shell: bash
        run: |
          curl -fsSL "https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-musl-static.tar.xz" \
            -o /tmp/ccache.tar.xz
          tar -xJf /tmp/ccache.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/ccache-4.13.6-linux-x86_64-musl-static/ccache" /usr/local/bin/ccache
          rm -rf /tmp/ccache.tar.xz "/tmp/ccache-4.13.6-linux-x86_64-musl-static"
          ccache --version
          which ccache

      # Pre-built wasm image path — pulls one ready-baked image with emsdk,
      # vcpkg, and ccache 4.13.6 all in place. Skips everything above for
      # toolchain setup.
      - name: Pick GHCR wasm image
        if: ${{ inputs.use_prebuilt_wasm_image }}
        id: wasm_image
        shell: bash
        run: |
          IMG="ghcr.io/${{ inputs.prebuilt_image_namespace }}/haybarn-wasm-${{ inputs.wasm_image_variant }}:${{ inputs.prebuilt_image_tag }}"
          echo "ref=${IMG}" >> "$GITHUB_OUTPUT"
          echo "Selected wasm image: ${IMG}"

      - name: Log in to GHCR (wasm path)
        if: ${{ inputs.use_prebuilt_wasm_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull wasm image
        if: ${{ inputs.use_prebuilt_wasm_image }}
        shell: bash
        run: docker pull "${{ steps.wasm_image.outputs.ref }}"

      - name: Prepare ccache_dir + docker env file (wasm Docker path)
        if: ${{ inputs.use_prebuilt_wasm_image }}
        shell: bash
        run: |
          mkdir -p ccache_dir
          # docker_env.txt mirrors the Linux Docker pattern. Image already
          # bakes CCACHE_BASEDIR=/duckdb_build_dir + tuning defaults; only
          # CCACHE_REMOTE_STORAGE needs propagation here because the bearer
          # token has to land at runtime, not build time.
          cat > docker_env.txt <<EOF
          CCACHE_REMOTE_STORAGE=http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.vcpkg_token }}|connect-timeout=10000|operation-timeout=30000
          # Haybarn: sccache for Rust extensions on wasm — see linux section.
          RUSTC_WRAPPER=sccache
          SCCACHE_WEBDAV_ENDPOINT=https://haybarn-vcpkg-cache.rusty-bb6.workers.dev/sccache/
          SCCACHE_WEBDAV_TOKEN=${{ secrets.vcpkg_token }}
          CARGO_INCREMENTAL=0
          # Haybarn: forward both the binary-package cache (R2 HTTP backend)
          # and the source-tarball asset cache into the container. The Linux
          # Docker path forwards both at line 497; this wasm prebuilt-image
          # path only forwarded the asset cache before, so vcpkg inside the
          # container couldn't find pre-built binaries and rebuilt every
          # package from source on every leg.
          VCPKG_BINARY_SOURCES=$VCPKG_BINARY_SOURCES
          X_VCPKG_ASSET_SOURCES=$X_VCPKG_ASSET_SOURCES
          DUCKDB_PLATFORM=${{ matrix.duckdb_arch }}
          DUCKDB_GIT_VERSION=${{ inputs.duckdb_version }}
          # Haybarn: forward the normalized version label into the container so
          # CMake embeds the right engine library_version in the extension binary.
          OVERRIDE_GIT_DESCRIBE=${{ startsWith(inputs.duckdb_version, 'haybarn-v1.5.2') && 'v1.5.2' || inputs.duckdb_version }}
          EXTENSION_NAME=${{ inputs.extension_name }}
          EXTENSION_CANONICAL=${{ inputs.extension_canonical }}
          ENABLE_EXTENSION_AUTOINSTALL=1
          ENABLE_EXTENSION_AUTOLOADING=1
          WASM_EXTENSIONS=1
          # Haybarn: forward USE_MERGED_VCPKG_MANIFEST into the container so
          # the in-container make picks up the merged vcpkg manifest produced
          # by extension_configuration_wasm (rather than dropping back to the
          # project-root vcpkg.json which omits per-extension deps like
          # avro-c). The Linux Docker path forwards this at line 507; the
          # wasm prebuilt-image path needs the same.
          USE_MERGED_VCPKG_MANIFEST=${{ inputs.use_merged_vcpkg_manifest }}
          SUBSET_EXTENSIONS_TESTS=${{ inputs.extensions_test_selection }}
          EOF
          echo '${{ inputs.test_config }}' | jq -r '.test_env_variables // {} | to_entries | map("\(.key)=\(.value)") | .[]' >> docker_env.txt

      - name: Downgrade AWS cli
        if: ${{ (contains(format(';{0};', inputs.extra_toolchains), ';downgraded_aws_cli;')) }}
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.22.35.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Inject extra extension config
        if: ${{ inputs.extra_extension_config }}
        shell: bash
        env:
          EXTENSION_CONFIG: ${{ inputs.extra_extension_config }}
        run: |
          echo -e "\n# Injected Extension Config\n$EXTENSION_CONFIG" >> ./extension_config.cmake
          cat ./extension_config.cmake

      - name: Run configure
        if: ${{ !inputs.use_prebuilt_wasm_image }}
        shell: bash
        env:
          DUCKDB_GIT_VERSION: ${{ inputs.duckdb_version }}
        run: |
          make configure_ci

      - name: Install extra vcpkg dependencies
        if: ${{ inputs.vcpkg_extra_dependencies != '' && !inputs.use_prebuilt_wasm_image }}
        shell: bash
        run: |
          JSON='${{inputs.vcpkg_extra_dependencies}}'
          DEPS=$(python3 -c "import json; data=json.loads(r'$JSON'); print(' '.join(data.get('${{ matrix.duckdb_arch }}', [])) if '${{ matrix.duckdb_arch }}' in data else '')" | tr -d '\n')
          if [ ! -z "$DEPS" ]; then
            for dep in $DEPS; do
              vcpkg install "$dep" --recurse
            done
          fi

      - name: Build Wasm module
        if: ${{ !inputs.use_prebuilt_wasm_image }}
        run: |
          EXTENSION_NAME=${{ inputs.extension_name }} EXTENSION_CANONICAL=${{ inputs.extension_canonical }} ENABLE_EXTENSION_AUTOINSTALL=1 ENABLE_EXTENSION_AUTOLOADING=1 make ${{ matrix.duckdb_arch }}

      # ----- Docker-based path (use_prebuilt_wasm_image = true) -----
      # Run configure + extra vcpkg deps + build inside the prebuilt
      # haybarn-wasm image. The image bakes emsdk, vcpkg, ccache 4.13.6
      # and emcc lives at a stable /emsdk path so ccache hashes repeat
      # across runs (no more /home/runner/work/_temp/<UUID> dance).
      - name: Run configure (inside Docker)
        if: ${{ inputs.use_prebuilt_wasm_image }}
        shell: bash
        run: |
          docker run --env-file=docker_env.txt \
            -v "$PWD":/duckdb_build_dir \
            -v "$PWD"/ccache_dir:/ccache_dir \
            "${{ steps.wasm_image.outputs.ref }}" \
            bash -lc 'source /emsdk/emsdk_env.sh > /dev/null && make configure_ci'

      - name: Install extra vcpkg dependencies (inside Docker)
        if: ${{ inputs.use_prebuilt_wasm_image && inputs.vcpkg_extra_dependencies != '' }}
        shell: bash
        run: |
          JSON='${{ inputs.vcpkg_extra_dependencies }}'
          DEPS=$(python3 -c "import json; data=json.loads(r'$JSON'); print(' '.join(data.get('${{ matrix.duckdb_arch }}', [])) if '${{ matrix.duckdb_arch }}' in data else '')" | tr -d '\n')
          if [ -n "$DEPS" ]; then
            docker run --env-file=docker_env.txt \
              -v "$PWD":/duckdb_build_dir \
              -v "$PWD"/ccache_dir:/ccache_dir \
              "${{ steps.wasm_image.outputs.ref }}" \
              bash -lc "source /emsdk/emsdk_env.sh > /dev/null && for dep in $DEPS; do vcpkg install \"\$dep\" --recurse; done"
          fi

      - name: Build Wasm module (inside Docker)
        if: ${{ inputs.use_prebuilt_wasm_image }}
        shell: bash
        run: |
          docker run --env-file=docker_env.txt \
            -v "$PWD":/duckdb_build_dir \
            -v "$PWD"/ccache_dir:/ccache_dir \
            "${{ steps.wasm_image.outputs.ref }}" \
            bash -lc 'source /emsdk/emsdk_env.sh > /dev/null && make ${{ matrix.duckdb_arch }}'

      # Haybarn: when vcpkg fails to build a port for wasm, the actual
      # compile-time error is in /vcpkg/buildtrees/<port>/install-<triplet>-*-out.log
      # inside the container — not surfaced to the workflow log. Dump them on
      # failure so wasm-port incompatibilities are diagnosable from CI without
      # having to docker-run locally.
      - name: Dump vcpkg buildtree logs on failure (wasm Docker path)
        if: ${{ inputs.use_prebuilt_wasm_image && failure() }}
        shell: bash
        run: |
          docker run --env-file=docker_env.txt \
            -v "$PWD":/duckdb_build_dir \
            "${{ steps.wasm_image.outputs.ref }}" \
            bash -lc '
              echo "=== vcpkg issue_body.md ==="
              for f in /duckdb_build_dir/build/${{ matrix.duckdb_arch }}/vcpkg_installed/vcpkg/issue_body.md; do
                [ -f "$f" ] && { echo "--- $f ---"; cat "$f"; }
              done
              echo
              echo "=== vcpkg buildtree install logs (per port) ==="
              for log in /vcpkg/buildtrees/*/install-wasm32-emscripten-*-out.log /vcpkg/buildtrees/*/install-wasm32-emscripten-*-err.log; do
                [ -f "$log" ] || continue
                echo "--- $log ---"
                tail -200 "$log"
                echo
              done
            ' || true

      - name: ccache stats (wasm Docker path)
        if: ${{ inputs.use_prebuilt_wasm_image && always() }}
        continue-on-error: true
        shell: bash
        run: |
          docker run --env-file=docker_env.txt \
            -v "$PWD"/ccache_dir:/ccache_dir \
            "${{ steps.wasm_image.outputs.ref }}" \
            ccache -s -v || true

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.upload_all_extensions }}
        with:
          if-no-files-found: error
          name: ${{ inputs.extension_name }}-${{ inputs.duckdb_version }}-extension-${{matrix.duckdb_arch}}${{inputs.artifact_postfix}}
          path: |
            build/${{ matrix.duckdb_arch }}/extension/${{ inputs.extension_name }}/${{ inputs.extension_name }}.duckdb_extension.wasm

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.upload_all_extensions}}
        with:
          if-no-files-found: error
          name: ${{ inputs.extension_name }}-${{ inputs.duckdb_version }}-extension-${{matrix.duckdb_arch}}${{inputs.artifact_postfix}}
          path: |
            build/${{ matrix.duckdb_arch }}/repository/**/*.duckdb_extension.wasm

      - name: Print Rust logs
        if: ${{ inputs.rust_logs && (inputs.enable_rust || contains(format(';{0};', inputs.extra_toolchains), ';rust;')) }}
        shell: bash
        run: |
          for filename in build/${{ inputs.build_type }}/rust/src/*/*build-*.log; do
            echo Printing logs for file $filename
            cat $filename;
            echo Done printing logs for $filename
          done
