# Reusable workflow for building DuckDB extensions using a standardized environment
#
# The workflow:
#   - builds the extension using the CI workflow from the corresponding DuckDB version
#   - uploads the extensions as gh actions artifacts in the following format:
#         <ext_name>-<duckdb_version>-extension-<arch><optional_postfix>
#
# note: extensions are simply uploaded to GitHub actions, deploying the extensions is done a separate step. More info on
#       this can be found in https://github.com/duckdb/extension-template

name: Extension distribution
on:
  workflow_call:
    secrets:
      VCPKG_CACHING_AWS_ACCESS_KEY_ID:
        required: false
      VCPKG_CACHING_AWS_SECRET_ACCESS_KEY:
        required: false
      VCPKG_CACHING_AWS_ENDPOINT_URL:
        required: false
      VCPKG_CACHING_AWS_DEFAULT_REGION:
        required: false
      # Haybarn: bearer token for the Haybarn vcpkg binary/asset cache; it is
      # substituted for {0} in vcpkg_binary_sources.
      vcpkg_token:
        required: false
    inputs:
      # The name with which the extension will be built
      extension_name:
        required: true
        type: string
      # If our extension is an alias extension, the name of the canonical extension
      extension_canonical:
        required: false
        type: string
      # DuckDB version to build against. When omitted, use the checked-out duckdb submodule.
      duckdb_version:
        required: false
        type: string
        default: ""
      # The extension-ci-tools ref used by this workflow.
      # Passing this explicitly is required because of https://github.com/actions/toolkit/issues/1264
      ci_tools_version:
        required: true
        type: string
      # ';' separated list of architectures to exclude, for example: 'linux_amd64;osx_arm64'
      exclude_archs:
        required: false
        type: string
        default: ""
      # ';' separated list of architectures to opt into, for example: 'osx_amd64;windows_arm64;linux_arm64_musl'
      # Explicit opt-ins override reduced CI, while exclusions take precedence.
      opt_in_archs:
        required: false
        type: string
        default: ""
      # ';' separated list of architectures that should not fail the workflow
      allow_failure_archs:
        required: false
        type: string
        default: ""
      # Postfix added to artifact names. Can be used to guarantee unique names when this workflow is called multiple times
      artifact_postfix:
        required: false
        type: string
        default: ""
      # Override the default vcpkg repository
      vcpkg_url:
        required: false
        type: string
        default: "https://github.com/microsoft/vcpkg.git"
      # Override the default vcpkg commit used by this version of DuckDB
      vcpkg_commit:
        required: false
        type: string
        default: "cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3" # Release 2026.06.24
      # Override the vcpkg binary sources config. By default, we use the public (read-only) cache from duckdb.
      vcpkg_binary_sources:
        required: false
        type: string
        default: ''
      vcpkg_extra_dependencies:
        required: false
        type: string
        default: ''
      # Enable building the DuckDB Shell
      build_duckdb_shell:
        required: false
        type: boolean
        default: true
      # Supply an override repository to build, instead of using the current one
      override_repository:
        required: false
        type: string
        default: ""
      # The git ref used for the override_repository
      override_ref:
        required: false
        type: string
        default: ""
      # Override the repo for the CI tools (for testing CI tools itself)
      override_ci_tools_repository:
        required: false
        type: string
        default: "duckdb/extension-ci-tools"
      # Override the duckdb repository (for using this workflow from a DuckDB fork)
      override_duckdb_repository:
        required: false
        type: string
        default: ""
      # Internal tooling option: allows automatically fetching the duckdb repo and ref from the calling repository.
      set_caller_as_duckdb:
        required: false
        type: boolean
        default: false
      # Pass extra toolchains
      #   available: (parser_tools, rust, fortran, omp, python3)
      extra_toolchains:
        required: false
        type: string
        default: ""
      # Experimental option to allow automatically building the vcpkg dependencies of duckdb extensions that are used for testing
      use_merged_vcpkg_manifest:
        required: false
        type: string
        default: ""
      rust_logs:
        required: false
        type: boolean
        default: false
      # Optional tag the build extension should have -- this is easy to misuse, and subject to change, for internal use only
      extension_tag:
        required: false
        type: string
        default: ""
      # Optional tag the referenced duckdb should have -- this is a easy to misuse, and subject to change, for internal use only
      duckdb_tag:
        required: false
        type: string
        default: ""
      # Optional DuckDB commit SHA -- useful for building against untagged versions of DuckDB
      duckdb_commit:
        required: false
        type: string
        default: ""
      # If set tot true, skip tests
      skip_tests:
        required: false
        type: boolean
        default: false
      save_cache:
        required: false
        type: boolean
        default: true
      # DEPRECATED: use extra_toolchains instead
      enable_rust:
        required: false
        type: boolean
        default: false
      test_config:
        required: false
        type: string
        default: "{}"
      build_type:
        required: false
        type: string
        default: "release"
      upload_all_extensions:
        required: false
        type: boolean
        default: false
      extra_extension_config:
        required: false
        type: string
        default: ""
      # auto/enabled/disabled: when enabled (or enabled through auto) will skip redundant architectures to reduce CI load
      reduced_ci_mode:
        required: false
        type: string
        default: 'auto'
      # disabling this can result in faster builds, but may run out of space on some runners
      run_disk_clean_step:
        required: false
        type: boolean
        default: true
      extensions_test_selection:
        required: false
        type: string
        default: 'regular'
      runners:
        required: false
        type: string
        default: '{}'
      post_build_command:
        required: false
        type: string
        default: ""
      # Override vcpkg overlay ports directory (relative to repo root, mounted at /duckdb_build_dir in Docker)
      vcpkg_overlay_ports:
        required: false
        type: string
        default: 'extension-ci-tools/vcpkg_ports'
      # Override vcpkg overlay triplets directory
      vcpkg_overlay_triplets:
        required: false
        type: string
        default: 'extension-ci-tools/toolchains'
      # CUDA GPU architectures to build for (e.g. "75;80;86;90a"). Empty disables CUDA arch specification.
      cuda_archs:
        required: false
        type: string
        default: ''
      # CUDA version for vcpkg ports that need version-specific binaries
      cuda_version:
        required: false
        type: string
        default: '13'
      # Haybarn: vcpkg asset (source tarball) mirror; empty = the Haybarn cache.
      vcpkg_asset_sources:
        required: false
        type: string
        default: ''
      # Haybarn: per-step timeout for extension tests.
      test_timeout_minutes:
        required: false
        type: number
        default: 30
      # Haybarn: whole-job limit for each platform build, so a hung build
      # frees its runner instead of holding it for GitHub's 6-hour default.
      job_timeout_minutes:
        required: false
        type: number
        default: 45
      # Haybarn 1.5 inputs, accepted so 1.5-era callers keep starting; the 2.0
      # workflow ignores them. matrix_parse_script was replaced by extbuild.
      # use_prebuilt_images / use_prebuilt_wasm_image / wasm_image_variant are
      # ignored too: Linux pulls haybarn-ci images (haybarn_image_version), and
      # the wasm job always runs in the pinned haybarn-wasm-{base,rust} image.
      matrix_parse_script:
        required: false
        type: string
        default: ''
      haybarn_image_version:
        description: haybarn-ci build image tag that Linux jobs pull instead of building docker/<arch> when it covers the job's toolchains and vcpkg; empty always builds inline
        required: false
        type: string
        default: 20261025-0cd72d7d
      use_prebuilt_images:
        required: false
        type: boolean
        default: false
      image_variant:
        required: false
        type: string
        default: 'base'
      prebuilt_image_tag:
        required: false
        type: string
        default: ''
      prebuilt_image_namespace:
        required: false
        type: string
        default: 'query-farm-haybarn'
      use_prebuilt_wasm_image:
        required: false
        type: boolean
        default: false
      wasm_image_variant:
        required: false
        type: string
        default: 'base'

env:
  # Haybarn: default to the Haybarn vcpkg cache (readwrite, Cloudflare Worker
  # in front of R2). Reads are anonymous; writes need the bearer token, which
  # replaces {0}. Quoted because the value contains `Authorization: Bearer`.
  VCPKG_BINARY_SOURCES: "${{ format(inputs.vcpkg_binary_sources == '' && 'clear;http,https://haybarn-vcpkg-cache.rusty-bb6.workers.dev,readwrite,Authorization: Bearer {0}' || inputs.vcpkg_binary_sources, secrets.vcpkg_token) }}"
  # Haybarn vcpkg asset cache (source-tarball mirror) on the same Worker, under
  # assets/. x-azurl has no header auth, so the token goes in the query string.
  X_VCPKG_ASSET_SOURCES: "${{ inputs.vcpkg_asset_sources == '' && format('clear;x-azurl,https://haybarn-vcpkg-cache.rusty-bb6.workers.dev/assets/,auth={0},readwrite', secrets.vcpkg_token) || inputs.vcpkg_asset_sources }}"
  USE_MERGED_VCPKG_MANIFEST: ${{ inputs.use_merged_vcpkg_manifest }}
  USE_DEFAULT_RUNNERS: ${{ inputs.runners == '{}' }}
  # Haybarn: shared ccache on the same Worker/R2 (as build.yml and the engine
  # release), so community builds hit across runs, repos and legs instead of
  # thrashing the 10 GB GitHub cache. Remote errors are misses, not failures.
  # https, so the bearer token is not sent in the clear: ccache's built-in HTTP
  # backend is http-only, so every job installs the ccache-storage-https helper
  # (.github/actions/cache-clients). The built-in backend kept its entries under
  # <url>/ccache/<2>/<38> and the helper appends only <2>/<38>, hence
  # /ccache/ccache: the same objects as the http clients (1.5 line, engine release).
  CCACHE_REMOTE_STORAGE: "${{ format('https://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache/ccache @bearer-token={0}', secrets.vcpkg_token) }}"
  CCACHE_NOHASHDIR: "1"
  CCACHE_SLOPPINESS: "time_macros,include_file_mtime,pch_defines"
  CCACHE_COMPILERCHECK: "content"
  # Haybarn: sccache for Rust on every leg: Linux Docker builds fetch it in
  # ci_phase (when the job uses Rust and the token is set), the other legs get it
  # from .github/actions/cache-clients (the wasm image ships it).
  SCCACHE_WEBDAV_ENDPOINT: https://haybarn-vcpkg-cache.rusty-bb6.workers.dev/sccache/
  SCCACHE_WEBDAV_TOKEN: ${{ secrets.vcpkg_token }}
  CI_EXTENSION_NAME: ${{ inputs.extension_name }}
  CI_EXTENSION_CANONICAL: ${{ inputs.extension_canonical }}
  DUCKDB_VERSION: ${{ inputs.duckdb_version }}
  DUCKDB_COMMIT: ${{ inputs.duckdb_commit }}
  CI_DUCKDB_GIT_REPOSITORY: ${{ inputs.override_duckdb_repository }}
  CI_EXTENSION_TAG: ${{ inputs.extension_tag }}
  DUCKDB_TAG: ${{ inputs.duckdb_tag }}
  CI_EXTRA_TOOLCHAINS: ${{ inputs.enable_rust && format('{0};rust;', inputs.extra_toolchains) || inputs.extra_toolchains }}
  CI_HAS_RUST: ${{ inputs.enable_rust || contains(format(';{0};', inputs.extra_toolchains), ';rust;') }}
  CI_EXTRA_EXTENSION_CONFIG: ${{ inputs.extra_extension_config }}
  CI_VCPKG_EXTRA_DEPENDENCIES: ${{ inputs.vcpkg_extra_dependencies }}
  CI_VCPKG_URL: ${{ inputs.vcpkg_url }}
  CI_VCPKG_COMMIT: ${{ inputs.vcpkg_commit }}
  CI_LINUX_IMAGE_VERSION: ${{ inputs.haybarn_image_version }}
  CI_VCPKG_OVERLAY_PORTS: ${{ inputs.vcpkg_overlay_ports }}
  CI_VCPKG_OVERLAY_TRIPLETS: ${{ inputs.vcpkg_overlay_triplets }}
  CI_CUDA_ARCHS: ${{ inputs.cuda_archs }}
  CI_CUDA_VERSION: ${{ inputs.cuda_version }}
  CI_BUILD_DUCKDB_SHELL: ${{ inputs.build_duckdb_shell }}
  CI_BUILD_TYPE: ${{ inputs.build_type }}
  CI_POST_BUILD_COMMAND: ${{ inputs.post_build_command }}
  CI_TEST_CONFIG: ${{ inputs.test_config }}
  CI_SKIP_TESTS: ${{ inputs.skip_tests }}
  CI_EXTENSIONS_TEST_SELECTION: ${{ inputs.extensions_test_selection }}
  CI_UPLOAD_ALL_EXTENSIONS: ${{ inputs.upload_all_extensions }}
  CI_ARTIFACT_POSTFIX: ${{ inputs.artifact_postfix }}
  CI_RUST_LOGS: ${{ inputs.rust_logs }}
  CI_RUN_DISK_CLEAN_STEP: ${{ inputs.run_disk_clean_step }}
  CI_USE_DEFAULT_RUNNERS: ${{ inputs.runners == '{}' }}
  CI_FETCH_PREBUILT_DUCKDB: true
  # Haybarn: the extension checkouts above are shallow and skip submodules;
  # ci_phase.py checkout completes them (see PhaseRunner.prepare_extension).
  CI_INIT_EXTENSION_SUBMODULES: true

jobs:
  generate_matrix:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      linux_matrix: ${{ steps.compute-matrix.outputs.linux_matrix }}
      windows_matrix: ${{ steps.compute-matrix.outputs.windows_matrix }}
      osx_matrix: ${{ steps.compute-matrix.outputs.osx_matrix }}
      wasm_matrix: ${{ steps.compute-matrix.outputs.wasm_matrix }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        name: Checkout Extension CI tools
        with:
          path: 'extension-ci-tools'
          ref: ${{ inputs.ci_tools_version }}
          repository: ${{ inputs.override_ci_tools_repository }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: extension-ci-tools/scripts/extbuild/go.mod
          cache: true
          cache-dependency-path: extension-ci-tools/scripts/extbuild/go.sum

      - name: Dump event path file
        run: |
          echo "$GITHUB_EVENT_PATH"
          cat "$GITHUB_EVENT_PATH"

      - id: compute-matrix
        name: Compute extension build matrix
        run: |
          make -C extension-ci-tools/scripts/extbuild test build -sj4
          extension-ci-tools/scripts/extbuild/build/extbuild matrix \
            --input extension-ci-tools/config/distribution_matrix.json \
            --exclude "${{ inputs.exclude_archs }}" \
            --opt-in "${{ inputs.opt_in_archs }}" \
            --runners '${{ inputs.runners }}' \
            --reduced-ci-mode "${{ inputs.reduced_ci_mode }}" \
            --out "$GITHUB_OUTPUT"
          echo "extbuild matrix output:"
          cat "$GITHUB_OUTPUT"

  linux:
    name: ${{ matrix.duckdb_arch }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    continue-on-error: ${{ contains(format(';{0};', inputs.allow_failure_archs), format(';{0};', matrix.duckdb_arch)) }}
    runs-on: ${{ startsWith(matrix.runner, '[') && fromJSON(matrix.runner) || matrix.runner }}
    needs: generate_matrix
    if: ${{ needs.generate_matrix.outputs.linux_matrix != '{}' && needs.generate_matrix.outputs.linux_matrix != '' }}
    strategy:
      fail-fast: ${{ inputs.reduced_ci_mode != 'disabled' }}
      matrix: ${{ fromJson(needs.generate_matrix.outputs.linux_matrix) }}
    env:
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_target_triplet }}
      VCPKG_HOST_TRIPLET: ${{ matrix.vcpkg_host_triplet }}
      AWS_ACCESS_KEY_ID: ${{ secrets.VCPKG_CACHING_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VCPKG_CACHING_AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.VCPKG_CACHING_AWS_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ secrets.VCPKG_CACHING_AWS_DEFAULT_REGION }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      GEN: ninja
      BUILD_SHELL: ${{ inputs.build_duckdb_shell && '1' || '0' }}
      DUCKDB_PLATFORM: ${{ matrix.duckdb_arch }}
      CI_PLATFORM: linux
      CI_MATRIX_RUNNER: ${{ matrix.runner }}

    steps:
      - name: Checkout / Extension repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.override_repository != '' && inputs.override_repository || github.repository }}
          ref: ${{ inputs.override_repository != '' && inputs.override_ref || '' }}
          # Haybarn: shallow, no submodules. ci_phase.py checkout then fetches the
          # tags on HEAD (all an extension's git-describe version can use) and
          # inits the extension's own submodules at depth 1, skipping the
          # duckdb / extension-ci-tools ones that it replaces anyway.
          fetch-depth: 1
          submodules: false

      - name: Checkout / Extension CI tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension-ci-tools
          ref: ${{ inputs.ci_tools_version }}
          repository: ${{ inputs.override_ci_tools_repository }}

      - name: Checkout / DuckDB from calling workflow
        if: ${{ inputs.set_caller_as_duckdb }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: duckdb
          fetch-tags: true
          fetch-depth: 0

      - name: Setup / Free disk space
        if: ${{ inputs.run_disk_clean_step && env.USE_DEFAULT_RUNNERS == 'true' }}
        uses: endersonmenezes/free-disk-space@7901478139cff6e9d44df5972fd8ab8fcade4db1 # v3.2.2
        continue-on-error: true
        with:
          remove_haskell: true
          remove_tool_cache: true
          remove_folders: "/usr/local/share/powershell /usr/share/swift"
          testing: false

      # Use system Python: Linux host configuration creates configure/venv, which must
      # remain usable inside the bind-mounted Docker workspace.
      - name: Checkout / Prepare sources
        id: prepare_sources
        run: python3 extension-ci-tools/scripts/ci_phase.py checkout

      - name: Setup / Ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        continue-on-error: true
        with:
          max-size: 5GB
          evict-old-files: job
          key: extension-distribution-${{ matrix.duckdb_arch }}-${{ steps.prepare_sources.outputs.duckdb_version }}
          restore-keys: |
            ccache-extension-distribution-${{ matrix.duckdb_arch }}-${{ steps.prepare_sources.outputs.duckdb_version }}
            extension-distribution-${{ matrix.duckdb_arch }}-
            ccache-extension-distribution-${{ matrix.duckdb_arch }}-
          save: ${{ inputs.save_cache }}

      # Haybarn: the ccache https helper for the Docker build (ci_phase maps it into the
      # container and fetches sccache there itself).
      - name: Setup / Cache clients
        uses: ./extension-ci-tools/.github/actions/cache-clients
        with:
          ccache: docker

      - name: Setup
        run: python3 extension-ci-tools/scripts/ci_phase.py setup

      - name: Build
        run: python3 extension-ci-tools/scripts/ci_phase.py build

      - name: Test
        timeout-minutes: ${{ inputs.test_timeout_minutes }}
        run: python3 extension-ci-tools/scripts/ci_phase.py test

      - name: Upload / Prepare artifacts
        id: artifacts
        run: python3 extension-ci-tools/scripts/ci_phase.py upload

      - name: Upload
        # Haybarn: retries the artifact control-plane registration, which
        # occasionally drops; see the action.
        uses: ./extension-ci-tools/.github/actions/upload-artifact-retry
        with:
          if-no-files-found: error
          name: ${{ steps.artifacts.outputs.artifact_name }}
          path: ${{ steps.artifacts.outputs.artifact_path }}

  macos:
    name: ${{ matrix.duckdb_arch }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    runs-on: ${{ startsWith(matrix.runner, '[') && fromJSON(matrix.runner) || matrix.runner }}
    # Haybarn: not gated on the Linux legs, so every platform builds at once (1.5: 5d8bb77).
    needs:
      - generate_matrix
    if: |
      always() &&
      !cancelled() &&
      needs.generate_matrix.outputs.osx_matrix != '{}' &&
      needs.generate_matrix.outputs.osx_matrix != '' &&
      needs.generate_matrix.result == 'success'
    strategy:
      fail-fast: ${{ inputs.reduced_ci_mode != 'disabled' }}
      matrix: ${{ fromJson(needs.generate_matrix.outputs.osx_matrix) }}
    env:
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_target_triplet }}
      VCPKG_HOST_TRIPLET: ${{ matrix.vcpkg_host_triplet }}
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/extension-ci-tools/vcpkg_ports
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/extension-ci-tools/toolchains
      USE_MERGED_VCPKG_MANIFEST: ${{ inputs.use_merged_vcpkg_manifest }}
      AWS_ACCESS_KEY_ID: ${{ secrets.VCPKG_CACHING_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VCPKG_CACHING_AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.VCPKG_CACHING_AWS_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ secrets.VCPKG_CACHING_AWS_DEFAULT_REGION }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      OSX_BUILD_ARCH: ${{ matrix.osx_build_arch }}
      GEN: ninja
      BUILD_SHELL: ${{ inputs.build_duckdb_shell && '1' || '0' }}
      DUCKDB_PLATFORM: ${{ matrix.duckdb_arch }}
      CI_PLATFORM: macos
      CI_MATRIX_RUNNER: ${{ matrix.runner }}
      CI_OSX_BUILD_ARCH: ${{ matrix.osx_build_arch }}

    steps:
      - name: Checkout / Extension repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.override_repository != '' && inputs.override_repository || github.repository }}
          ref: ${{ inputs.override_repository != '' && inputs.override_ref || '' }}
          # Haybarn: shallow, no submodules. ci_phase.py checkout then fetches the
          # tags on HEAD (all an extension's git-describe version can use) and
          # inits the extension's own submodules at depth 1, skipping the
          # duckdb / extension-ci-tools ones that it replaces anyway.
          fetch-depth: 1
          submodules: false

      - name: Checkout / Extension CI tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension-ci-tools
          ref: ${{ inputs.ci_tools_version }}
          repository: ${{ inputs.override_ci_tools_repository }}

      - name: Checkout / Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Checkout / DuckDB from calling workflow
        if: ${{ inputs.set_caller_as_duckdb }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: duckdb
          fetch-tags: true
          fetch-depth: 0

      - name: Checkout / Prepare sources
        id: prepare_sources
        run: python3 extension-ci-tools/scripts/ci_phase.py checkout

      - name: Setup / Go
        if: ${{ contains(format(';{0};', inputs.extra_toolchains), ';go;') }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.23'

      - name: Setup / Ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        continue-on-error: true
        with:
          max-size: 5GB
          evict-old-files: job
          key: extension-distribution-${{ matrix.duckdb_arch }}-${{ steps.prepare_sources.outputs.duckdb_version }}
          restore-keys: |
            ccache-extension-distribution-${{ matrix.duckdb_arch }}-${{ steps.prepare_sources.outputs.duckdb_version }}
            extension-distribution-${{ matrix.duckdb_arch }}-
            ccache-extension-distribution-${{ matrix.duckdb_arch }}-
          save: ${{ inputs.save_cache }}

      # Haybarn: ccache https helper; sccache as RUSTC_WRAPPER for Rust extensions.
      - name: Setup / Cache clients
        uses: ./extension-ci-tools/.github/actions/cache-clients
        with:
          rust: ${{ env.CI_HAS_RUST }}

      - name: Setup
        run: python3 extension-ci-tools/scripts/ci_phase.py setup

      - name: Build
        run: python3 extension-ci-tools/scripts/ci_phase.py build

      - name: Test
        timeout-minutes: ${{ inputs.test_timeout_minutes }}
        run: python3 extension-ci-tools/scripts/ci_phase.py test

      - name: Upload / Prepare artifacts
        id: artifacts
        run: python3 extension-ci-tools/scripts/ci_phase.py upload

      - name: Upload
        # Haybarn: retries the artifact control-plane registration, which
        # occasionally drops; see the action.
        uses: ./extension-ci-tools/.github/actions/upload-artifact-retry
        with:
          if-no-files-found: error
          name: ${{ steps.artifacts.outputs.artifact_name }}
          path: ${{ steps.artifacts.outputs.artifact_path }}

  windows:
    name: ${{ matrix.duckdb_arch }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    runs-on: ${{ startsWith(matrix.runner, '[') && fromJSON(matrix.runner) || matrix.runner }}
    # Haybarn: not gated on the Linux legs, so every platform builds at once (1.5: 5d8bb77).
    needs:
      - generate_matrix
    if: |
      always() &&
      !cancelled() &&
      needs.generate_matrix.outputs.windows_matrix != '{}' &&
      needs.generate_matrix.outputs.windows_matrix != '' &&
      needs.generate_matrix.result == 'success'
    strategy:
      fail-fast: ${{ inputs.reduced_ci_mode != 'disabled' }}
      matrix: ${{ fromJson(needs.generate_matrix.outputs.windows_matrix) }}
    env:
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_target_triplet }}
      VCPKG_HOST_TRIPLET: ${{ matrix.vcpkg_host_triplet }}
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/extension-ci-tools/vcpkg_ports
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/extension-ci-tools/toolchains
      USE_MERGED_VCPKG_MANIFEST: ${{ inputs.use_merged_vcpkg_manifest }}
      AWS_ACCESS_KEY_ID: ${{ secrets.VCPKG_CACHING_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VCPKG_CACHING_AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.VCPKG_CACHING_AWS_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ secrets.VCPKG_CACHING_AWS_DEFAULT_REGION }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      BUILD_SHELL: ${{ inputs.build_duckdb_shell && '1' || '0' }}
      DUCKDB_PLATFORM: ${{ matrix.duckdb_arch }}
      CC: ${{ (matrix.duckdb_arch == 'windows_amd64_rtools' || matrix.duckdb_arch == 'windows_amd64_mingw') && 'gcc' || 'cl' }}
      CXX: ${{ (matrix.duckdb_arch == 'windows_amd64_rtools' || matrix.duckdb_arch == 'windows_amd64_mingw') && 'g++' || 'cl' }}
      GEN: ninja
      CI_PLATFORM: windows
      CI_MATRIX_RUNNER: ${{ matrix.runner }}

    steps:
      - name: Checkout / Configure line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout / Extension repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.override_repository != '' && inputs.override_repository || github.repository }}
          ref: ${{ inputs.override_repository != '' && inputs.override_ref || '' }}
          # Haybarn: shallow, no submodules. ci_phase.py checkout then fetches the
          # tags on HEAD (all an extension's git-describe version can use) and
          # inits the extension's own submodules at depth 1, skipping the
          # duckdb / extension-ci-tools ones that it replaces anyway.
          fetch-depth: 1
          submodules: false

      - name: Checkout / Extension CI tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension-ci-tools
          ref: ${{ inputs.ci_tools_version }}
          repository: ${{ inputs.override_ci_tools_repository }}

      - name: Checkout / Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Checkout / DuckDB from calling workflow
        if: ${{ inputs.set_caller_as_duckdb }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: duckdb
          fetch-tags: true
          fetch-depth: 0

      - name: Checkout / Prepare sources
        id: prepare_sources
        run: python extension-ci-tools/scripts/ci_phase.py checkout

      - name: Setup / Rust
        if: ${{ inputs.enable_rust || contains(format(';{0};', inputs.extra_toolchains), ';rust;') }}
        uses: &rust-toolchain-action dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Setup / Rust for MinGW
        if: ${{ (inputs.enable_rust || contains(format(';{0};', inputs.extra_toolchains), ';rust;')) && (matrix.duckdb_arch == 'windows_amd64_rtools' || matrix.duckdb_arch == 'windows_amd64_mingw') }}
        uses: *rust-toolchain-action
        with:
          targets: x86_64-pc-windows-gnu

      - name: Setup / Go
        if: ${{ contains(format(';{0};', inputs.extra_toolchains), ';go;') }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.23'

      - name: Setup / Ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          max-size: 5GB
          evict-old-files: job
          key: extension-distribution-${{ matrix.duckdb_arch }}-${{ steps.prepare_sources.outputs.duckdb_version }}
          restore-keys: |
            ccache-extension-distribution-${{ matrix.duckdb_arch }}-${{ steps.prepare_sources.outputs.duckdb_version }}
            extension-distribution-${{ matrix.duckdb_arch }}-
            ccache-extension-distribution-${{ matrix.duckdb_arch }}-
          save: ${{ inputs.save_cache }}

      # Haybarn: ccache-action installs ccache 4.9.1 here, which cannot use the
      # https remote (no storage helpers; its HTTP backend also silently failed
      # bearer-token uploads); cache-clients puts 4.13.6 ahead of it on PATH, adds
      # the ccache https helper, and sccache as RUSTC_WRAPPER for Rust extensions.
      - name: Setup / Cache clients
        uses: ./extension-ci-tools/.github/actions/cache-clients
        with:
          rust: ${{ env.CI_HAS_RUST }}

      - name: Setup / Rtools
        if: ${{ matrix.duckdb_arch == 'windows_amd64_rtools' || matrix.duckdb_arch == 'windows_amd64_mingw' }}
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          r-version: devel
          update-rtools: true
          rtools-version: '42'

      - name: Setup / Short vcpkg path
        shell: pwsh
        run: |
          $basePath = Split-Path -Path (Split-Path -Path $env:GITHUB_WORKSPACE -Parent) -Parent
          $vcpkgRoot = "$basePath/vcpkg"
          echo "VCPKG_WINDOWS_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          echo "VCPKG_TOOLCHAIN_PATH=$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" >> $env:GITHUB_ENV

      - name: Setup / Vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: ${{ inputs.vcpkg_commit }}
          vcpkgGitURL: ${{ inputs.vcpkg_url }}
          vcpkgDirectory: ${{ env.VCPKG_WINDOWS_ROOT }}

      - name: Setup
        run: python extension-ci-tools/scripts/ci_phase.py setup

      - name: Build
        run: python extension-ci-tools/scripts/ci_phase.py build

      - name: Test
        timeout-minutes: ${{ inputs.test_timeout_minutes }}
        run: python extension-ci-tools/scripts/ci_phase.py test

      - name: Upload / Prepare artifacts
        id: artifacts
        run: python extension-ci-tools/scripts/ci_phase.py upload

      - name: Upload
        # Haybarn: retries the artifact control-plane registration, which
        # occasionally drops; see the action.
        uses: ./extension-ci-tools/.github/actions/upload-artifact-retry
        with:
          if-no-files-found: error
          name: ${{ steps.artifacts.outputs.artifact_name }}
          path: ${{ steps.artifacts.outputs.artifact_path }}

  wasm:
    name: ${{ matrix.duckdb_arch }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    runs-on: ${{ startsWith(matrix.runner, '[') && fromJSON(matrix.runner) || matrix.runner }}
    # Haybarn: the wasm build image haybarn-wasm 2.0 builds its bundles in, so these side modules and
    # the main module that loads them share one emscripten (the image sets the version; the
    # wasm-toolchain action checks it). Pinned by digest (haybarn-wasm-{base,rust}:v2.0.0-2), published by publish-build-images.yml.
    container:
      image: ${{ (inputs.enable_rust || contains(format(';{0};', inputs.extra_toolchains), ';rust;')) && 'ghcr.io/query-farm-haybarn/haybarn-wasm-rust@sha256:ae0fceaa9a18f7361230a8189283fadeffd03857694f959ff1a4b1b0d1bf0113' || 'ghcr.io/query-farm-haybarn/haybarn-wasm-base@sha256:3c841479b14f1337b4711952896066a98a41fed78615ebac9678d41bc98c7f5b' }}
    # Haybarn: not gated on the Linux legs, so every platform builds at once (1.5: 5d8bb77).
    needs:
      - generate_matrix
    if: |
      always() &&
      !cancelled() &&
      needs.generate_matrix.outputs.wasm_matrix != '{}' &&
      needs.generate_matrix.outputs.wasm_matrix != '' &&
      needs.generate_matrix.result == 'success'
    strategy:
      fail-fast: ${{ inputs.reduced_ci_mode != 'disabled' }}
      matrix: ${{ fromJson(needs.generate_matrix.outputs.wasm_matrix) }}
    env:
      # Haybarn: emscripten 6.0.6 stopped linking libc++ when the link is driven
      # by `emcc` rather than `em++`. C dependencies that pull in a C++ static
      # library (avro-c's tools against libsnappy.a) then fail with undefined
      # `operator new`/`__cxa_guard_*`. Restore the pre-6 default for every
      # emcc invocation in the build, dependencies included. The -Wno flag keeps
      # compile-only calls quiet (emcc warns that the link setting is unused
      # there, which is fatal for dependencies that build with -Werror).
      EMCC_CFLAGS: -sDEFAULT_TO_CXX -Wno-unused-command-line-argument
      VCPKG_TARGET_TRIPLET: ${{ matrix.vcpkg_target_triplet }}
      VCPKG_HOST_TRIPLET: ${{ matrix.vcpkg_host_triplet }}
      # Haybarn: VCPKG_TOOLCHAIN_PATH / VCPKG_OVERLAY_* are set by "Setup / Container paths":
      # github.workspace is the host path in a container job.
      USE_MERGED_VCPKG_MANIFEST: ${{ inputs.use_merged_vcpkg_manifest }}
      AWS_ACCESS_KEY_ID: ${{ secrets.VCPKG_CACHING_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VCPKG_CACHING_AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.VCPKG_CACHING_AWS_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ secrets.VCPKG_CACHING_AWS_DEFAULT_REGION }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      DUCKDB_PLATFORM: ${{ matrix.duckdb_arch }}
      WASM_EXTENSIONS: 1
      # Haybarn: the image's python3 is Ubuntu's (externally managed); let builds that pip install
      # outside a venv do so, as they could with setup-python's.
      PIP_BREAK_SYSTEM_PACKAGES: 1
      CI_PLATFORM: wasm
      CI_MATRIX_RUNNER: ${{ matrix.runner }}

    steps:
      - name: Checkout / Extension repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ inputs.override_repository != '' && inputs.override_repository || github.repository }}
          ref: ${{ inputs.override_repository != '' && inputs.override_ref || '' }}
          # Haybarn: shallow, no submodules. ci_phase.py checkout then fetches the
          # tags on HEAD (all an extension's git-describe version can use) and
          # inits the extension's own submodules at depth 1, skipping the
          # duckdb / extension-ci-tools ones that it replaces anyway.
          fetch-depth: 1
          submodules: false

      - name: Checkout / Extension CI tools
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: extension-ci-tools
          ref: ${{ inputs.ci_tools_version }}
          repository: ${{ inputs.override_ci_tools_repository }}

      # Haybarn: no setup-python here. Its CPython comes from the host's tool cache (mounted at
      # /__t) and has no working ssl module in this image ("unknown url type: https" for any
      # download, e.g. ducksassy's SDK); the image's python3 (Ubuntu 24.04, 3.12) has one.

      - name: Checkout / DuckDB from calling workflow
        if: ${{ inputs.set_caller_as_duckdb }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: duckdb
          fetch-tags: true
          fetch-depth: 0

      - name: Checkout / Prepare sources
        id: prepare_sources
        run: python3 extension-ci-tools/scripts/ci_phase.py checkout

      - name: Setup / Container paths
        shell: bash
        run: |
          {
            echo "VCPKG_TOOLCHAIN_PATH=$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake"
            echo "VCPKG_OVERLAY_PORTS=$GITHUB_WORKSPACE/extension-ci-tools/vcpkg_ports"
            echo "VCPKG_OVERLAY_TRIPLETS=$GITHUB_WORKSPACE/extension-ci-tools/toolchains"
          } >> "$GITHUB_ENV"

      # Haybarn: actions/cache rather than ccache-action, which would install apt's ccache and
      # configure a cache dir that the image's CCACHE_DIR overrides. Restored before wasm-toolchain,
      # which zeroes the restored stats so `ccache -s` counts this job only.
      - name: Setup / Ccache
        id: ccache-restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ccache
          key: ccache-image-extension-distribution-${{ matrix.duckdb_arch }}-${{ steps.prepare_sources.outputs.duckdb_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-image-extension-distribution-${{ matrix.duckdb_arch }}-${{ steps.prepare_sources.outputs.duckdb_version }}-
            ccache-image-extension-distribution-${{ matrix.duckdb_arch }}-

      # Haybarn: emscripten comes from the container image (no setup-emsdk).
      - name: Setup / Emscripten check, ccache
        uses: ./extension-ci-tools/.github/actions/wasm-toolchain

      - name: Setup / Rust
        if: ${{ (inputs.enable_rust || contains(format(';{0};', inputs.extra_toolchains), ';rust;')) && matrix.duckdb_arch == 'wasm_mvp' }}
        uses: *rust-toolchain-action
        with:
          targets: wasm32-unknown-emscripten

      # Haybarn: the Haybarn wasm_eh / wasm_threads engines are built with native
      # wasm exceptions (-fwasm-exceptions). Rust extensions for them rebuild std
      # with a pinned nightly (-Z build-std, needs rust-src), whose
      # wasm32-unknown-emscripten default is native EH; the stable precompiled
      # std carries legacy emscripten EH trampolines the engine never provides
      # (`TypeError: c is not a function` at the first exception path,
      # haybarn-wasm#9). wasm_threads also needs shared-memory atomics.
      - name: Setup / Rust (nightly, native wasm EH)
        if: ${{ (inputs.enable_rust || contains(format(';{0};', inputs.extra_toolchains), ';rust;')) && matrix.duckdb_arch != 'wasm_mvp' }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (takes a toolchain input)
        with:
          toolchain: nightly-2026-05-20
          targets: wasm32-unknown-emscripten
          components: rust-src

      - name: Setup / Rust wasm flags
        if: ${{ (inputs.enable_rust || contains(format(';{0};', inputs.extra_toolchains), ';rust;')) && matrix.duckdb_arch != 'wasm_mvp' }}
        shell: bash
        run: |
          echo 'CARGO_UNSTABLE_BUILD_STD=std,panic_abort' >> "$GITHUB_ENV"
          # Over the extension's rust-toolchain.toml and the image's default 1.86.0, which Corrosion
          # otherwise picks: stable ignores CARGO_UNSTABLE_BUILD_STD and links its precompiled,
          # non-atomic, legacy-EH std (wasm_threads: "--shared-memory is disallowed by alloc-...";
          # wasm_eh: "DISABLE_EXCEPTION_CATCHING=0 is not compatible with -fwasm-exceptions").
          echo 'RUSTUP_TOOLCHAIN=nightly-2026-05-20' >> "$GITHUB_ENV"
          # Corrosion ignores RUSTUP_TOOLCHAIN and takes rustup's default toolchain.
          rustup default nightly-2026-05-20
          # target-scoped, so host build scripts and proc-macros stay non-atomic
          if [ "${{ matrix.duckdb_arch }}" = "wasm_threads" ]; then
            echo 'CARGO_TARGET_WASM32_UNKNOWN_EMSCRIPTEN_RUSTFLAGS=-Ctarget-feature=+atomics,+bulk-memory,+mutable-globals' >> "$GITHUB_ENV"
          fi

      # Haybarn: ccache https helper; sccache (the image's) as RUSTC_WRAPPER for Rust extensions.
      - name: Setup / Cache clients
        uses: ./extension-ci-tools/.github/actions/cache-clients
        with:
          rust: ${{ env.CI_HAS_RUST }}

      - name: Setup / Go
        if: ${{ contains(format(';{0};', inputs.extra_toolchains), ';go;') }}
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.23'

      - name: Setup
        run: python3 extension-ci-tools/scripts/ci_phase.py setup

      - name: Build
        run: python3 extension-ci-tools/scripts/ci_phase.py build

      - name: Ccache stats
        if: ${{ !cancelled() }}
        run: |
          ccache -s -v
          # As ccache-action's evict-old-files: job, keep only what this job used.
          ccache --evict-older-than "$(( $(date +%s) - HAYBARN_CCACHE_START + 60 ))s"

      - name: Ccache save
        if: ${{ !cancelled() && inputs.save_cache }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Test
        timeout-minutes: ${{ inputs.test_timeout_minutes }}
        run: python3 extension-ci-tools/scripts/ci_phase.py test

      - name: Upload / Prepare artifacts
        id: artifacts
        run: python3 extension-ci-tools/scripts/ci_phase.py upload

      - name: Upload
        # Haybarn: retries the artifact control-plane registration, which
        # occasionally drops; see the action.
        uses: ./extension-ci-tools/.github/actions/upload-artifact-retry
        with:
          if-no-files-found: error
          name: ${{ steps.artifacts.outputs.artifact_name }}
          path: ${{ steps.artifacts.outputs.artifact_path }}
